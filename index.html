<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=yes"><meta name="theme-color" content="#f8f6f0"><title>말씀대로 · QT & LIFE v1.2</title><style>
:root{--bg:#f8f6f0;--surface:#fff;--ink:#27342d;--muted:#7b877e;--line:#e7eae3;--brand:#28624b;--soft:#e9f2e9;--gold:#d7aa70;--nav:82px}*{box-sizing:border-box}html{height:100%;-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;overscroll-behavior:none}button,input,textarea,select{font:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.5;cursor:default}.app{max-width:680px;margin:auto;min-height:100dvh;background:var(--bg)}header{position:sticky;top:0;z-index:5;background:rgba(248,246,240,.95);backdrop-filter:blur(15px);padding:calc(env(safe-area-inset-top) + 14px) 20px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(200,211,200,.45)}.eyebrow{font-size:11px;letter-spacing:1.5px;color:var(--brand);font-weight:800}.logo{font-family:Georgia,'Noto Serif KR',serif;font-size:25px;font-weight:800;letter-spacing:-1px}.iconbtn{border:1px solid var(--line);border-radius:14px;background:white;padding:10px;color:var(--ink)}main{padding:20px 18px calc(var(--nav) + env(safe-area-inset-bottom) + 28px);min-height:70vh}h1,h2,h3,p{margin:0}h1{font-size:25px;line-height:1.3;letter-spacing:-.8px}h2{font-size:19px;letter-spacing:-.5px}h3{font-size:16px}p{line-height:1.7}.sub{color:var(--muted);font-size:13px}.section{margin:22px 0 12px}.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:13px;box-shadow:0 3px 16px rgba(44,77,55,.025)}.hero{background:linear-gradient(130deg,#245a45,#41795d);border-radius:24px;padding:24px 21px;color:#fff;margin-bottom:17px}.hero .sub{color:#d8e8da}.hero h1{margin:10px 0}.hero button{background:white;color:var(--brand)}.btn{border:0;border-radius:14px;background:var(--brand);color:#fff;min-height:46px;padding:11px 15px;font-weight:750;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn.secondary{background:var(--soft);color:var(--brand)}.btn.ghost{background:#f1f3ef;color:var(--ink)}.btn.danger{background:#ffeaea;color:#a52b2b}.btn.full{width:100%}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.stack{display:grid;gap:10px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.mini{background:#f7faf6;border-radius:15px;padding:15px}.mini strong{display:block;font-size:21px;color:var(--brand);margin-bottom:4px}.pill{display:inline-block;background:var(--soft);color:var(--brand);border-radius:100px;padding:5px 10px;font-size:12px;font-weight:750}.muted{color:var(--muted)}label{font-size:13px;font-weight:750;display:block;margin-bottom:7px}.field{margin:15px 0}input,textarea,select{border:1px solid #dce3dc;background:white;color:var(--ink);border-radius:13px;width:100%;padding:12px;outline:none;min-height:45px}input:focus,textarea:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 3px #28624b18}textarea{resize:vertical;min-height:95px;line-height:1.6}textarea.large{min-height:125px}.hint{font-size:12px;color:var(--muted);margin-top:5px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:680px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding:8px 2px calc(7px + env(safe-area-inset-bottom));background:rgba(255,255,255,.97);border-top:1px solid var(--line);z-index:10;backdrop-filter:blur(14px)}.nav button{border:0;background:none;color:#94a197;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;padding:7px 2px;min-height:52px}.nav button.active{color:var(--brand);font-weight:800}.nav .sym{font-size:19px}.nav button{font-size:10px;white-space:nowrap;letter-spacing:-.4px}.choice{display:block;text-align:left;width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;background:white;margin:7px 0;color:var(--ink)}.choice.selected{border-color:var(--brand);background:var(--soft)}.choice.correct{border-color:#369668;background:#e7f9ea}.choice.wrong{border-color:#ce8f8f;background:#fff0ed}.bar{height:8px;background:#e5ebe4;border-radius:10px;overflow:hidden}.bar span{display:block;height:100%;background:var(--brand)}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{border:1px solid var(--line);padding:9px 0;background:white;border-radius:11px;text-align:center;font-size:13px;color:var(--ink)}.day.mark{background:var(--soft);border-color:#96baa3;color:var(--brand);font-weight:800}.day.today{outline:2px solid var(--gold)}.record{border-left:3px solid var(--brand);padding-left:12px;margin-top:10px}.empty{text-align:center;padding:24px 10px;color:var(--muted)}.small{font-size:12px}.warning{background:#fff5e4;border-radius:13px;padding:12px;font-size:12px;color:#796340}.toast{position:fixed;left:50%;bottom:calc(95px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#263c30;color:white;padding:11px 17px;border-radius:13px;z-index:30;font-size:13px;box-shadow:0 5px 15px #0002;max-width:90vw}.hidden{display:none!important}.divider{border:0;border-top:1px solid var(--line);margin:16px 0}.checkline{display:flex;align-items:start;gap:9px;padding:10px 0}.checkline input{width:20px;min-height:20px;accent-color:var(--brand)}.checkline label{font-weight:500;margin:0}.inline{display:flex;gap:8px;flex-wrap:wrap}.inline>*{flex:1}.foot{text-align:center;font-size:11px;color:var(--muted);padding:20px 0}body.dark{--bg:#161e1a;--surface:#222c26;--ink:#edf2ed;--muted:#b4beb5;--line:#38483d;--brand:#9bd8af;--soft:#304a39}body.dark header{background:#161e1af0}body.dark input,body.dark textarea,body.dark select,body.dark .choice,body.dark .day,body.dark .iconbtn{background:var(--surface);color:var(--ink);border-color:var(--line)}body.dark .mini{background:#2b3930}body.dark .nav{background:#1d2822f5}body.dark .btn.ghost{background:#344037}body.dark .hero{background:linear-gradient(130deg,#284c37,#355b45)}@media(min-width:700px){body{background:#e9eee7}.app{box-shadow:0 5px 45px #0001}}
input.checkinput{width:19px;min-height:19px;vertical-align:middle;margin-right:7px;accent-color:var(--brand)}.reading{font-size:17px;line-height:1.9}.reading p{line-height:1.9} </style></head><body><div class="app"><header><div><div class="eyebrow">QT & LIFE</div><div class="logo">말씀대로 <span style="color:#b49b6a">✝</span></div></div><button class="iconbtn" onclick="navigate('settings')" aria-label="설정">⚙️</button></header><main id="view"></main><nav class="nav" id="nav" aria-label="하단 메뉴"></nav></div><div id="toast" class="toast hidden" role="status"></div><input type="file" id="importFile" accept="application/json,.json" class="hidden"><script>
'use strict';
const DB_NAME='malssumdaero_qt_life',VERSION=3,STORES=['qtQuestions','thoughtNotes','presentations','settings','qtNotes','practiceGoals','practiceLogs','reflections','questions','testAttempts','challenges','prayers'];let db,route='home',state={date:today(),qt:null,goal:null,quiz:null,quizIndex:0,quizAnswers:[],testConfig:{scope:'today',type:'mixed',count:5},growthMonth:today().slice(0,7)};
function today(){let d=new Date();return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(d)}function uid(){return crypto.randomUUID?crypto.randomUUID():'id_'+Date.now()+'_'+Math.random().toString(36).slice(2)}function now(){return new Date().toISOString()}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(s){let e=document.getElementById('toast');e.textContent=s;e.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hidden'),2400)}function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DB_NAME,VERSION);r.onupgradeneeded=()=>{let d=r.result;for(let x of STORES)if(!d.objectStoreNames.contains(x))d.createObjectStore(x,{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function tx(store,mode='readonly'){return db.transaction(store,mode).objectStore(store)}function save(store,obj){return new Promise((res,rej)=>{let r=tx(store,'readwrite').put(obj);r.onsuccess=()=>res(obj);r.onerror=()=>rej(r.error)})}function all(store){return new Promise((res,rej)=>{let r=tx(store).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function get(store,id){return new Promise((res,rej)=>{let r=tx(store).get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function del(store,id){return new Promise((res,rej)=>{let r=tx(store,'readwrite').delete(id);r.onsuccess=res;r.onerror=()=>rej(r.error)})}async function byDate(store,date){return (await all(store)).filter(x=>x.localDate===date)}function formatDate(d){return `${d.slice(0,4)}.${d.slice(5,7)}.${d.slice(8,10)}`}function dateShift(date,n){let d=new Date(date+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}function heading(title,sub=''){return `<div class="section"><h1>${title}</h1>${sub?`<p class="sub">${sub}</p>`:''}</div>`}function button(t,act,kind=''){return `<button class="btn ${kind}" onclick="${act}">${t}</button>`}function navHtml(){let items=[['home','⌂','홈'],['qt','▤','큐티'],['questions','❔','질문'],['thoughts','✎','생각노트'],['presentation','🎙','발표문'],['practice','♧','실천'],['growth','▥','성장']];document.getElementById('nav').innerHTML=items.map(([id,ic,t])=>`<button class="${route===id?'active':''}" onclick="navigate('${id}')"><span class="sym">${ic}</span>${t}</button>`).join('')}
function navigate(to){if(route==='qt'&&to!=='qt'&&document.getElementById('passage'))saveQT(false);if(route==='presentation'&&to!=='presentation'&&document.getElementById('presTitle'))savePresentation(false);if(route==='thoughts'&&to!=='thoughts'&&document.getElementById('thoughtBody'))saveThought(false);route=to;history.pushState({route:to},'',location.pathname+location.search+'#'+to);render();window.scrollTo(0,0)}window.onpopstate=()=>{route=location.hash.slice(1)||'home';render()};async function render(){navHtml();let v=document.getElementById('view');try{if(route==='home')await home(v);else if(route==='qt')await qt(v);else if(route==='presentation')await presentation(v);else if(route==='questions')await questions(v);else if(route==='thoughts')await thoughts(v);else if(route==='practice')await practice(v);else if(route==='growth')await growth(v);else if(route==='settings')await settings(v);else if(route==='review')await review(v);else if(route==='notes')await notes(v);else navigate('home')}catch(e){console.error(e);v.innerHTML=`<div class="card"><h2>화면을 여는 중 문제가 발생했습니다</h2><p class="sub">${esc(e.message)}</p>${button('다시 열기','render()','secondary')}</div>`}}
const defaults={content:'',feelings:'',application:'',prayer:''};
async function currentNote(){let a=await byDate('qtNotes',state.date);return a.sort((x,y)=>y.updatedAt.localeCompare(x.updatedAt))[0]||null}
async function currentGoal(){let a=await byDate('practiceGoals',state.date);return a[0]||null}
async function home(v){let notes=await byDate('qtNotes',today()),goals=await byDate('practiceGoals',today()),refl=await byDate('reflections',today()),presentations=await byDate('presentations',today());let n=notes[0],g=goals[0];v.innerHTML=`<p class="sub">${formatDate(today())} · 오늘도 말씀과 함께</p><div class="hero"><div class="sub">오늘의 여정</div><h1>말씀을 읽고,<br>삶에서 한 걸음 실천해요.</h1><p class="sub" style="margin-bottom:16px">기록의 양보다 마음을 돌아보는 시간이 중요해요.</p>${button(n?'오늘의 큐티 이어쓰기 →':'오늘의 큐티 시작 →',"navigate('qt')")}</div><div class="grid3"><div class="mini"><strong>${notes.length}</strong><span class="small muted">오늘 큐티</span></div><div class="mini"><strong>${presentations.length}</strong><span class="small muted">발표 준비</span></div><div class="mini"><strong>${refl.length}</strong><span class="small muted">하루 점검</span></div></div><div class="card" style="margin-top:14px"><h3>🎙 큐티를 내 말로 발표해요</h3><p class="sub" style="margin:10px 0">말씀의 내용, 깨달음, 실천 약속을 정리해서 발표문을 만들고 연습해요.</p>${button('발표문 준비하기',"navigate('presentation')",'secondary full')}</div><h2 class="section">오늘의 실천</h2><div class="card">${g?`<span class="pill">${esc(g.statusLabel||'실천 중')}</span><h3 style="margin:11px 0">${esc(g.title)}</h3><p class="sub">연결 본문: ${esc(g.passageRef||'없음')}</p>${button('실천 기록하기',"navigate('practice')",'secondary full')}`:`<p class="sub" style="margin-bottom:13px">큐티에서 삶에 적용할 작은 행동을 정해보세요.</p>${button('실천 목표 만들기',"navigate('practice')",'secondary full')}`}</div><h2 class="section">저녁에 돌아보기</h2><div class="card"><p class="sub" style="margin-bottom:13px">오늘 배운 말씀은 어떤 순간에 생각났나요? 어려웠던 순간도 정직하게 기록해요.</p>${button(refl.length?'점검 기록 다시 보기':'하루 점검 작성',"navigate('review')",'secondary full')}</div><div class="card"><div class="row"><h3>최근 큐티</h3>${button('전체 기록',"navigate('notes')",'ghost')}</div><div id="recentNotes" class="sub" style="margin-top:10px">${n?`${esc(n.title||n.passageRef||'제목 미지정')} · ${esc((n.note?.feelings||n.note?.content||n.note?.reflection||n.note?.observation||'작성 중').slice(0,65))}`:'아직 기록이 없어요.'}</div></div>`}
async function qt(v){
 let n=await currentNote(),old=n?.note||{},content=old.content??[old.observation,old.interpretation].filter(Boolean).join('\n\n'),feelings=old.feelings??old.reflection??'';
 v.innerHTML=heading('나의 큐티노트','말씀을 기록하고, 느낀 것을 적고, 오늘의 삶으로 연결해요.')+`
 <div class="card">
  <div class="field"><label for="qtDate">① 날짜</label><input type="date" id="qtDate" value="${esc(state.date)}" onchange="changeQTDate(this.value)"></div>
  <div class="field"><label for="qtTitle">② 제목</label><input id="qtTitle" value="${esc(n?.title||'')}" placeholder="예: 듣기는 속히, 말하기는 더디" oninput="scheduleQTSave()"></div>
  <div class="field"><label for="passage">③ 본문 (성경 구절)</label><input id="passage" value="${esc(n?.passageRef||'')}" placeholder="예: 야고보서 1:19-20" oninput="scheduleQTSave()"><textarea id="passageText" class="large" placeholder="묵상할 성경 본문을 직접 적어보세요. (선택)" oninput="scheduleQTSave()">${esc(n?.passageText||'')}</textarea><p class="hint">본문은 구절 주소와 본문 내용을 함께 기록할 수 있어요.</p></div>
  <div class="field"><label for="content">④ 내용 (말씀의 내용과 이해한 점)</label><textarea id="content" class="large" placeholder="오늘 읽은 말씀은 어떤 내용인가요?" oninput="scheduleQTSave()">${esc(content)}</textarea></div>
  <div class="field"><label for="feelings">⑤ 느낀 점</label><textarea id="feelings" class="large" placeholder="말씀을 읽으며 어떤 생각이나 깨달음이 있었나요?" oninput="scheduleQTSave()">${esc(feelings)}</textarea></div>
  <div class="field"><label for="application">⑥ 적용점 (오늘의 행동 약속)</label><textarea id="application" class="large" placeholder="예: 동료가 말할 때 끼어들지 않고 끝까지 듣기" oninput="scheduleQTSave()">${esc(old.application||'')}</textarea><p class="hint">여기에 적은 내용이 실천 화면의 목표로 연결됩니다. 작고 구체적인 행동이 좋아요.</p></div>
  <div class="field"><label for="prayer">⑦ 기도</label><textarea id="prayer" class="large" placeholder="오늘의 말씀을 생각하며 기도해 보세요." oninput="scheduleQTSave()">${esc(old.prayer||'')}</textarea></div>
  <div class="row"><span class="sub" id="saveStatus" aria-live="polite">작성 내용은 자동 저장돼요.</span>${button('큐티 저장','saveQT(true)')}</div>
 </div><div class="card" style="background:var(--soft)"><h3>🌱 말씀을 오늘의 삶으로</h3><p class="sub" style="margin:10px 0 15px">적용점에 적은 내용을 실천 목표로 만들고, 하루 동안 기억하고 행동하도록 도와드릴게요.</p>${button('적용점으로 실천 시작하기 →','fromQT()','full')}<div style="margin-top:9px">${button('큐티에서 생긴 질문 적기 →',"navigate('questions')",'secondary full')}<div style="margin-top:9px">${button('생각노트 열기 →',"navigate('thoughts')",'ghost full')}</div><div style="margin-top:9px">${button('발표문 작성하기 →','openPresentationFromQT()','secondary full')}</div></div></div>
 <div class="card warning">성경 본문을 직접 입력한 경우 해당 번역의 저작권 및 사용 조건을 지켜주세요. 개인 기록을 공유할 때도 확인이 필요합니다.</div>`;
}
async function changeQTDate(d){if(!d||d===state.date)return;await saveQT(false);state.date=d;render()}
function changeDate(d){if(!d)return;state.date=d;render()}
let qtTimer;
function scheduleQTSave(){let e=document.getElementById('saveStatus');if(e)e.textContent='저장 중…';clearTimeout(qtTimer);qtTimer=setTimeout(()=>saveQT(false),650)}
async function saveQT(show){
 clearTimeout(qtTimer);if(route!=='qt')return;
 let val=id=>document.getElementById(id)?.value||'';
 let title=val('qtTitle').trim(),passageRef=val('passage').trim(),passageText=val('passageText').trim();
 let note=Object.fromEntries(Object.keys(defaults).map(k=>[k,val(k)]));
 let existing=await currentNote();
 if(!title&&!passageRef&&!passageText&&!Object.values(note).some(x=>x.trim())){if(show)toast('제목이나 큐티 내용을 먼저 입력해 주세요');return}
 await save('qtNotes',{...existing,id:existing?.id||uid(),localDate:state.date,title,passageRef,passageText,note,createdAt:existing?.createdAt||now(),updatedAt:now()});
 let el=document.getElementById('saveStatus');if(el)el.textContent='✓ 자동 저장됨';if(show)toast('큐티를 저장했어요');
}
async function fromQT(){
 await saveQT(false);let n=await currentNote();if(!n?.note?.application?.trim()){toast('⑥ 적용점에 오늘 실천할 행동을 적어주세요');return}
 let old=await currentGoal(),newTitle=n.note.application.trim();
 await save('practiceGoals',{...old,id:old?.id||uid(),qtId:n.id,localDate:state.date,title:newTitle,passageRef:n.passageRef,status:old?.status||'planned',ifWhen:old?.ifWhen||'',thenAction:old?.thenAction||'',support:old?.support||'',createdAt:old?.createdAt||now(),updatedAt:now()});
 toast('큐티 적용점을 실천 목표로 연결했어요');navigate('practice');
}
 
async function openPresentationFromQT(){await saveQT(false);navigate('presentation')}
async function currentPresentation(){return (await byDate('presentations',state.date)).sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt))[0]||null}
function presentationBody(p){return p?.body??[p?.presIntro,p?.presContext,p?.presLearning,p?.presApply,p?.presEnd].filter(Boolean).join('\n\n')}
async function presentation(v){let n=await currentNote(),p=await currentPresentation();v.innerHTML=heading('🎙 발표문','발표문 양식은 제목 · 본문 · 내용 세 가지입니다.')+`<div class="card">${n?`<div class="mini"><span class="pill">${esc(state.date)} 큐티 연결</span><p style="margin-top:8px">${esc(n.title||'오늘의 큐티')}</p></div>`:`<p class="sub">큐티를 작성하면 제목과 본문을 가져올 수 있어요. 발표문은 별도로 작성할 수도 있습니다.</p>`}<div class="field"><label for="presTitle">① 제목</label><input id="presTitle" value="${esc(p?.presentationTitle??n?.title??'')}" placeholder="발표 제목" oninput="schedulePresentationSave()"></div><div class="field"><label for="presPassage">② 본문</label><textarea id="presPassage" class="large" placeholder="말씀 본문이나 성경 구절을 적으세요" oninput="schedulePresentationSave()">${esc(p?.presentationPassage??[n?.passageRef,n?.passageText].filter(Boolean).join('\n'))}</textarea></div><div class="field"><label for="presBody">③ 내용</label><textarea id="presBody" style="min-height:250px" placeholder="듣는 사람에게 전하고 싶은 내용을 자유롭게 작성하세요" oninput="schedulePresentationSave()">${esc(presentationBody(p))}</textarea></div><div class="row"><span class="sub" id="presStatus">자동 저장됩니다</span>${button('발표문 저장','savePresentation(true)')}</div><div class="inline" style="margin-top:12px">${button('발표 화면','showPresentation()','secondary')}${button('복사','copyPresentation()','ghost')}</div><div class="field"><label for="presDone">발표 상태</label><select id="presDone" onchange="schedulePresentationSave()"><option value="draft" ${p?.status!=='ready'&&p?.status!=='presented'?'selected':''}>작성 중</option><option value="ready" ${p?.status==='ready'?'selected':''}>준비 완료</option><option value="presented" ${p?.status==='presented'?'selected':''}>발표 완료</option></select></div></div><div class="card"><h3>💬 질문에서 발표로</h3><p class="sub" style="margin:10px 0">본문을 읽고 궁금한 점을 질문에 적어두면 다른 사람과 말씀을 나눌 때 활용할 수 있어요.</p>${button('나의 질문 보기',"navigate('questions')",'secondary full')}</div>`}
let presTimer;
function schedulePresentationSave(){let el=document.getElementById('presStatus');if(el)el.textContent='저장 중…';clearTimeout(presTimer);presTimer=setTimeout(()=>savePresentation(false),650)}
async function savePresentation(show){clearTimeout(presTimer);if(!document.getElementById('presTitle'))return;let n=await currentNote(),old=await currentPresentation();let presentationTitle=document.getElementById('presTitle').value,presentationPassage=document.getElementById('presPassage').value,body=document.getElementById('presBody').value,status=document.getElementById('presDone').value;if(!presentationTitle.trim()&&!presentationPassage.trim()&&!body.trim()){if(show)toast('발표문을 작성해 주세요');return}await save('presentations',{...old,id:old?.id||uid(),qtId:n?.id||old?.qtId||null,localDate:state.date,presentationTitle,presentationPassage,body,status,createdAt:old?.createdAt||now(),updatedAt:now()});let e=document.getElementById('presStatus');if(e)e.textContent='✓ 저장됨';if(show)toast('발표문을 저장했어요')}
async function showPresentation(){await savePresentation(false);let p=await currentPresentation();if(!p)return toast('발표문을 먼저 작성해 주세요');route='presentationPreview';navHtml();document.getElementById('view').innerHTML=`<div class="row" style="margin-bottom:14px"><h2>발표 화면</h2>${button('돌아가기',"navigate('presentation')",'secondary')}</div><div class="card reading"><h2>${esc(p.presentationTitle||'발표문')}</h2><p class="sub" style="white-space:pre-wrap;margin:14px 0">${esc(p.presentationPassage||'')}</p><p style="white-space:pre-wrap">${esc(presentationBody(p))}</p></div>`}
async function copyPresentation(){await savePresentation(false);let p=await currentPresentation();if(!p)return toast('발표문을 먼저 작성해 주세요');try{await navigator.clipboard.writeText([p.presentationTitle,p.presentationPassage,presentationBody(p)].filter(Boolean).join('\n\n'));toast('복사했어요')}catch(e){toast('복사를 지원하지 않는 실행 환경입니다')}}
async function questions(v){let n=await currentNote(),items=(await all('qtQuestions')).sort((a,b)=>(b.updatedAt||b.createdAt).localeCompare(a.updatedAt||a.createdAt));let todayItems=items.filter(x=>x.localDate===state.date);v.innerHTML=heading('❔ 말씀 질문','큐티를 읽으며 생긴 궁금증을 직접 질문하고 답하며, 나중에 함께 나눠요.')+`<div class="card"><div class="row"><h3>오늘의 큐티 질문</h3><span class="pill">${formatDate(state.date)}</span></div><p class="sub" style="margin:10px 0">${esc(n?.title||'큐티가 없어도 질문을 남길 수 있어요.')}</p><div class="field"><label for="questionInput">궁금한 점 · 나에게 묻는 질문</label><textarea id="questionInput" placeholder="예: 이 말씀은 당시 누구에게 하신 말씀일까?"></textarea></div><div class="field"><label for="answerInput">나의 생각과 답변 (나중에 작성해도 돼요)</label><textarea id="answerInput" placeholder="찾아본 내용, 내 생각, 아직 모르겠는 부분…"></textarea></div>${button('질문 저장','addQuestion()','full')}<p class="hint">정답이 없는 질문도 괜찮아요. 다른 사람들과 나누고 싶은 질문은 아래에서 복사할 수 있습니다.</p></div><h2 class="section">선택한 날짜의 질문 · ${todayItems.length}개</h2><div class="card">${todayItems.length?todayItems.map(q=>questionCard(q)).join(''):'<p class="empty">오늘의 첫 질문을 작성해 보세요.</p>'}</div><h2 class="section">전체 질문 모음 · ${items.length}개</h2><div class="card">${items.filter(x=>x.localDate!==state.date).slice(0,30).map(q=>questionCard(q)).join('')||'<p class="sub">다른 날짜에 작성한 질문이 아직 없어요.</p>'}</div>`}
function questionCard(q){return `<div class="record"><span class="small muted">${esc(q.localDate)} · ${esc(q.qtTitle||'자유 질문')}</span><h3 style="margin:8px 0">${esc(q.question)}</h3><p style="white-space:pre-wrap">${esc(q.answer||'아직 답변을 작성하지 않았어요.')}</p><div class="inline" style="margin:10px 0">${button('답변 수정',`editQuestion('${q.id}')`,'secondary')}${button('나눔용 복사',`copyQuestion('${q.id}')`,'ghost')}${button('삭제',`deleteRecord('qtQuestions','${q.id}')`,'danger')}</div></div>`}
async function addQuestion(){let question=document.getElementById('questionInput').value.trim(),answer=document.getElementById('answerInput').value.trim();if(!question)return toast('질문을 입력해 주세요');let n=await currentNote();await save('qtQuestions',{id:uid(),localDate:state.date,qtId:n?.id||null,qtTitle:n?.title||'',question,answer,createdAt:now(),updatedAt:now()});toast('질문을 저장했어요');render()}
async function editQuestion(id){let q=await get('qtQuestions',id);if(!q)return;let value=prompt('질문을 수정해 주세요',q.question);if(value===null)return;if(!value.trim())return toast('질문을 입력해 주세요');let a=prompt('내 생각 / 답변을 수정해 주세요',q.answer||'');if(a===null)return;await save('qtQuestions',{...q,question:value.trim(),answer:a,updatedAt:now()});render()}
async function copyQuestion(id){let q=await get('qtQuestions',id);if(!q)return;try{await navigator.clipboard.writeText(`질문: ${q.question}\n내 생각: ${q.answer||'(함께 생각해 보고 싶어요)'}`);toast('나눌 질문을 복사했어요')}catch(e){toast('클립보드를 지원하지 않아요')}}
let thoughtEditing=null,thoughtTimer;
async function thoughts(v){let items=(await all('thoughtNotes')).sort((a,b)=>(b.updatedAt||b.createdAt).localeCompare(a.updatedAt||a.createdAt));let current=thoughtEditing?items.find(x=>x.id===thoughtEditing):null;v.innerHTML=heading('✎ 생각노트','큐티와 일상에서 떠오른 생각을 형식 없이 자유롭게 기록해요.')+`<div class="card"><div class="row"><h3>자유롭게 적어보기</h3><span class="pill">${current?'수정 중':'새 노트'}</span></div><div class="field"><label for="thoughtTitle">제목 (선택)</label><input id="thoughtTitle" placeholder="떠오른 생각에 제목을 붙여도 좋아요" value="${esc(current?.title||'')}" oninput="scheduleThoughtSave()"></div><div class="field"><label for="thoughtBody">생각 노트</label><textarea id="thoughtBody" style="min-height:260px" placeholder="오늘 들은 말씀, 내 생각, 고민, 감사, 궁금증… 자유롭게 작성해요." oninput="scheduleThoughtSave()">${esc(current?.body||'')}</textarea></div><label class="checkline"><input type="checkbox" id="thoughtLink" ${current?.qtId?'checked':''} onchange="scheduleThoughtSave()">오늘의 큐티와 연결하기</label><div class="row"><span class="sub" id="thoughtStatus">작성 중 자동 저장</span>${button('저장','saveThought(true)')}</div><div style="margin-top:10px">${button('새 노트 작성','newThought()','secondary full')}</div></div><h2 class="section">내 생각 기록 · ${items.length}개</h2><div class="card">${items.length?items.map(t=>`<div class="record"><span class="small muted">${esc(t.localDate)} ${t.qtId?'· 큐티 연결':''}</span><h3 style="margin:6px 0">${esc(t.title||'제목 없는 생각')}</h3><p class="sub" style="white-space:pre-wrap">${esc(t.body.slice(0,150))}</p><div class="inline" style="margin-top:10px">${button('열어보기',`openThought('${t.id}')`,'secondary')}${button('삭제',`removeThought('${t.id}')`,'danger')}</div></div>`).join(''):'<p class="empty">자유롭게 적은 생각이 이곳에 쌓여요.</p>'}</div>`}
function scheduleThoughtSave(){let e=document.getElementById('thoughtStatus');if(e)e.textContent='저장 중…';clearTimeout(thoughtTimer);thoughtTimer=setTimeout(()=>saveThought(false),750)}
async function saveThought(show){clearTimeout(thoughtTimer);let el=document.getElementById('thoughtBody');if(!el)return;let title=document.getElementById('thoughtTitle').value.trim(),body=el.value,linked=document.getElementById('thoughtLink').checked;if(!title&&!body.trim()){if(show)toast('내용을 먼저 적어 주세요');return}let old=thoughtEditing?await get('thoughtNotes',thoughtEditing):null,n=linked?await currentNote():null;let id=old?.id||uid();await save('thoughtNotes',{...old,id,title,body,localDate:old?.localDate||state.date,qtId:linked?n?.id||null:null,createdAt:old?.createdAt||now(),updatedAt:now()});thoughtEditing=id;let e=document.getElementById('thoughtStatus');if(e)e.textContent='✓ 저장됨';if(show){toast('생각노트를 저장했어요');render()}}
async function openThought(id){await saveThought(false);thoughtEditing=id;route='thoughts';render();window.scrollTo(0,0)}
async function newThought(){await saveThought(false);thoughtEditing=null;render();window.scrollTo(0,0)}
async function removeThought(id){if(!confirm('이 생각노트를 삭제할까요?'))return;await del('thoughtNotes',id);if(thoughtEditing===id)thoughtEditing=null;render()}
async function test(v){v.innerHTML=heading('말씀 이해도 테스트','기억한 지식과 삶의 적용을 함께 돌아봐요.')+`<div class="card"><div class="field"><label>1. 시험 말씀 범위</label><select id="scope"><option value="today">오늘 큐티 말씀</option><option value="recent">최근 7일 큐티</option><option value="all">전체 준비된 문제은행</option></select></div><div class="field"><label>2. 시험 방식</label><select id="quizType"><option value="mixed">종합 시험</option><option value="choice">본문 이해 중심</option><option value="scenario">상황별 말씀 적용</option></select></div><div class="field"><label>3. 문제 수</label><select id="count"><option value="3">3문제</option><option value="5" selected>5문제</option><option value="10">10문제</option></select></div><p class="hint">현재 버전은 검토된 샘플 문제은행 10문항을 제공합니다. 준비되지 않은 본문은 문제를 만들어낸 것처럼 표시하지 않습니다.</p><div style="margin-top:15px">${button('시험 시작','startQuiz()','full')}</div></div><h2 class="section">최근 시험 기록</h2><div class="card" id="testsHistory">불러오는 중…</div>`;let tries=(await all('testAttempts')).sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).slice(0,6);document.getElementById('testsHistory').innerHTML=tries.length?tries.map(t=>`<div class="row" style="padding:9px 0;border-bottom:1px solid var(--line)"><span class="sub">${esc(t.localDate)} · ${esc(t.scope)}</span><strong>${t.correct}/${t.total}</strong></div>`).join(''):'<p class="sub">아직 응시 기록이 없어요.</p>'}
async function startQuiz(){let scope=document.getElementById('scope').value,type=document.getElementById('quizType').value,count=+document.getElementById('count').value;let pool=BANK.filter(q=>type==='mixed'||q.type===type);if(scope!=='all'){let days=scope==='today'?[today()]:Array.from({length:7},(_,i)=>dateShift(today(),-i));let notes=(await all('qtNotes')).filter(n=>days.includes(n.localDate));pool=pool.filter(q=>notes.some(n=>n.passageRef.replaceAll(/\s/g,'').includes(q.ref.replaceAll(/\s/g,''))||q.ref.replaceAll(/\s/g,'').includes(n.passageRef.replaceAll(/\s/g,''))&&n.passageRef.length>4))}if(!pool.length){toast('이 범위에 준비된 문제가 없어요. 전체 문제은행을 선택하세요.');return}state.quiz={scope,type,items:shuffle(pool).slice(0,count),startedAt:now()};state.quizIndex=0;state.quizAnswers=[];renderQuiz()}function renderQuiz(){route='quiz';navHtml();let quiz=state.quiz;if(!quiz){navigate('test');return}let i=state.quizIndex,q=quiz.items[i];document.getElementById('view').innerHTML=`<div class="row"><h2>말씀 이해도 테스트</h2><span class="pill">${i+1} / ${quiz.items.length}</span></div><div class="bar" style="margin:17px 0"><span style="width:${(i+1)/quiz.items.length*100}%"></span></div><div class="card"><span class="sub">${esc(q.ref)}</span><h2 style="margin:13px 0 20px">${esc(q.q)}</h2>${q.opts.map((o,j)=>`<button class="choice" id="ans${j}" onclick="answerQuiz(${j})">${j+1}. ${esc(o)}</button>`).join('')}<div id="feedback"></div><div id="nextButton"></div></div>`}function answerQuiz(j){let q=state.quiz.items[state.quizIndex];if(state.quizAnswers[state.quizIndex]!==undefined)return;state.quizAnswers[state.quizIndex]=j;q.opts.forEach((_,k)=>{let e=document.getElementById('ans'+k);e.disabled=true;if(k===q.a)e.classList.add('correct');if(k===j&&k!==q.a)e.classList.add('wrong')});document.getElementById('feedback').innerHTML=`<div class="mini" style="margin-top:14px"><strong style="font-size:15px">${j===q.a?'정답이에요!':'다시 복습해보세요.'}</strong><p class="sub">${esc(q.ex)}</p></div>`;document.getElementById('nextButton').innerHTML=button(state.quizIndex===state.quiz.items.length-1?'시험 결과 보기':'다음 문제','nextQuiz()','full')}async function nextQuiz(){if(state.quizIndex<state.quiz.items.length-1){state.quizIndex++;renderQuiz();return}let q=state.quiz,correct=q.items.filter((x,i)=>x.a===state.quizAnswers[i]).length;await save('testAttempts',{id:uid(),localDate:today(),scope:q.scope,type:q.type,total:q.items.length,correct,answers:q.items.map((x,i)=>({question:x.q,selected:state.quizAnswers[i],correct:x.a,explanation:x.ex,options:x.opts})),createdAt:now()});state.quiz=null;route='quizResult';navHtml();document.getElementById('view').innerHTML=`${heading('시험을 마쳤어요!','틀린 문제는 다시 말씀을 읽으며 복습해보세요.')}<div class="card" style="text-align:center"><span class="sub">맞힌 문제 수</span><h1 style="font-size:52px;margin:12px;color:var(--brand)">${correct}<span style="font-size:21px;color:var(--muted)"> / ${q.items.length}</span></h1>${button('시험 화면으로','navigate(\'test\')','full')}</div><div class="card"><h3>문제별 복습</h3>${q.items.map((x,i)=>`<div class="record"><strong>${state.quizAnswers[i]===x.a?'✓':'○'} ${esc(x.q)}</strong><p class="sub">${esc(x.ex)}</p></div>`).join('')}</div>`}

 </div>

 <div class="field"><label for="logStatus">현재 실천 상태</label><select id="logStatus"><option value="done">기억하며 실천했어요</option><option value="attempted">시도했지만 어려웠어요</option><option value="difficult">실천하지 못했어요</option><option value="later">아직 기회가 없었어요</option></select></div>
 <div class="field"><label for="logText">어떤 일이 있었고 어떻게 행동했나요?</label><textarea id="logText" placeholder="예: 누군가 반박했을 때 바로 화내지 않고 먼저 들었어요."></textarea></div>
 ${button('오늘의 행동 기록하기','saveLog()','full secondary')}</div>
 <h2 class="section">실천 일지</h2><div class="card">${logs.length?logs.map(x=>`<div class="record"><div class="row"><span class="pill">${esc(statusName(x.status))}</span><button class="iconbtn" onclick="deleteRecord('practiceLogs','${x.id}')" aria-label="기록 삭제">✕</button></div><p style="margin-top:8px">${esc(x.text)}</p><span class="sub">${new Date(x.createdAt).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}</span></div>`).join(''):'<div class="empty">오늘의 첫 실천을 기록해 보세요.</div>'}</div>${button('하루를 돌아보고 기도하기 →','navigate(\'review\')','full')}`;
}
function statusName(s){return {done:'실천했어요',attempted:'시도했어요',difficult:'어려웠어요',later:'기회가 없었어요',planned:'실천 예정'}[s]||'기록'}async function saveGoal(){let title=document.getElementById('goalTitle').value.trim(),passageRef=document.getElementById('goalRef').value.trim();if(!title)return toast('실천할 행동을 적어주세요');let old=await currentGoal(),n=await currentNote();await save('practiceGoals',{...old,id:old?.id||uid(),qtId:old?.qtId||n?.id||null,localDate:state.date,title,passageRef,ifWhen:document.getElementById('ifWhen').value.trim(),thenAction:document.getElementById('thenAction').value.trim(),support:document.getElementById('support').value.trim(),status:old?.status||'planned',createdAt:old?.createdAt||now(),updatedAt:now()});toast('실천 계획을 저장했어요');render()}
async function saveLog(){let text=document.getElementById('logText').value.trim(),status=document.getElementById('logStatus').value;if(!text)return toast('경험한 상황을 간단히 작성해 주세요');let g=await currentGoal();if(!g)return toast('실천 목표를 먼저 저장해 주세요');await save('practiceLogs',{id:uid(),goalId:g.id,localDate:state.date,status,text,createdAt:now()});await save('practiceGoals',{...g,status,updatedAt:now()});toast('실천 기록을 남겼어요');render()}async function review(v){let old=(await byDate('reflections',state.date)).find(r=>r.period==='day');let n=await currentNote(),g=await currentGoal();v.innerHTML=heading('하루 돌아보기','잘한 일도 어려웠던 일도 말씀 앞에서 돌아봐요.')+`<div class="card"><p class="sub">${formatDate(state.date)}</p><h3 style="margin:10px 0">오늘의 말씀: ${esc(n?.title||n?.passageRef||'아직 기록 없음')}</h3><p class="sub">실천 목표: ${esc(g?.title||'아직 기록 없음')}</p><div class="field"><label>① 오늘 감사한 일은?</label><textarea id="thanks">${esc(old?.thanks||'')}</textarea></div><div class="field"><label>② 말씀을 기억하며 실천한 순간은?</label><textarea id="did">${esc(old?.did||'')}</textarea></div><div class="field"><label>③ 어려웠던 순간은? 왜 그랬을까요?</label><textarea id="hard">${esc(old?.hard||'')}</textarea></div><div class="field"><label>④ 내일 다시 시도할 작은 행동은?</label><textarea id="next">${esc(old?.next||'')}</textarea></div><div class="field"><label>⑤ 오늘의 기도</label><textarea id="prayer">${esc(old?.prayer||'')}</textarea></div>${button('하루 점검 저장','saveReview()','full')}</div>`}async function saveReview(){let old=(await byDate('reflections',state.date)).find(r=>r.period==='day');let item={id:old?.id||uid(),period:'day',localDate:state.date,thanks:document.getElementById('thanks').value,did:document.getElementById('did').value,hard:document.getElementById('hard').value,next:document.getElementById('next').value,prayer:document.getElementById('prayer').value,createdAt:old?.createdAt||now(),updatedAt:now()};await save('reflections',item);toast('하루 점검이 저장되었어요');navigate('home')}
async function growth(v){let [notes,logs,pres,reviews]=await Promise.all(['qtNotes','practiceLogs','presentations','reflections'].map(all));let month=state.growthMonth,monthly=notes.filter(x=>x.localDate.startsWith(month)),monthlyLogs=logs.filter(x=>x.localDate.startsWith(month)),monthlyTests=pres.filter(x=>x.localDate.startsWith(month));let [year,m]=month.split('-').map(Number),first=new Date(Date.UTC(year,m-1,1)).getUTCDay(),days=new Date(Date.UTC(year,m,0)).getUTCDate();let cells=Array.from({length:first},()=>'<div></div>');for(let d=1;d<=days;d++){let date=`${month}-${String(d).padStart(2,'0')}`,marked=notes.some(n=>n.localDate===date);cells.push(`<button class="day ${marked?'mark':''} ${date===today()?'today':''}" onclick="openDate('${date}')">${d}${marked?' ·':''}</button>`)}let archive=[...notes].sort((a,b)=>b.localDate.localeCompare(a.localDate));v.innerHTML=heading('성장 기록','결과보다 꾸준한 성찰과 삶의 변화를 발견해요.')+`<div class="grid3"><div class="mini"><strong>${monthly.length}</strong><span class="small muted">이달 큐티</span></div><div class="mini"><strong>${monthlyLogs.length}</strong><span class="small muted">실천 기록</span></div><div class="mini"><strong>${monthlyTests.length}</strong><span class="small muted">발표 준비</span></div></div><div class="card" style="margin-top:15px"><div class="row" style="margin-bottom:16px"><button class="iconbtn" onclick="monthShift(-1)">〈</button><h3>${year}년 ${m}월</h3><button class="iconbtn" onclick="monthShift(1)">〉</button></div><div class="days" style="margin-bottom:9px">${['일','월','화','수','목','금','토'].map(s=>`<div class="sub" style="text-align:center">${s}</div>`).join('')}</div><div class="days">${cells.join('')}</div><p class="hint">초록색은 큐티를 기록한 날입니다. 날짜를 누르면 해당 날짜 기록으로 이동해요.</p></div><div class="card"><h3>나의 기록 돌아보기</h3>${archive.length?archive.slice(0,15).map(n=>`<button class="choice" onclick="openDate('${n.localDate}')"><strong>${esc(n.localDate)}</strong><p class="sub">${esc(n.title||n.passageRef||'제목 미지정')} · ${esc((n.note?.feelings||n.note?.content||n.note?.reflection||n.note?.observation||'기록 보기').slice(0,60))}</p></button>`).join(''):'<p class="empty">첫 큐티 기록을 작성하면 이곳에 표시돼요.</p>'}</div><div class="card"><h3>이번 달 돌아보기</h3><p class="sub" style="margin:10px 0">기록의 횟수는 신앙을 평가하는 점수가 아니에요. 처음 묵상과 최근 묵상을 비교하면서 작은 변화를 발견해보세요.</p>${button('오늘의 하루 점검','navigate(\'review\')','secondary full')}</div>`}
function monthShift(n){let [y,m]=state.growthMonth.split('-').map(Number);let d=new Date(Date.UTC(y,m-1+n,1));state.growthMonth=d.toISOString().slice(0,7);render()}function openDate(d){state.date=d;navigate('qt')}
async function notes(v){let a=(await all('qtNotes')).sort((x,y)=>y.localDate.localeCompare(x.localDate));v.innerHTML=heading('큐티 기록 보관함','작성한 큐티를 날짜별로 다시 볼 수 있어요.')+`<div class="card">${a.length?a.map(n=>`<div class="record"><div class="row"><strong>${esc(n.localDate)} · ${esc(n.title||n.passageRef||'제목 미지정')}</strong><button class="iconbtn" onclick="deleteRecord('qtNotes','${n.id}')">✕</button></div><p class="sub">${esc((n.note?.feelings||n.note?.content||n.note?.reflection||n.note?.observation||'기록 내용 없음').slice(0,110))}</p><button class="btn secondary" style="margin-top:9px" onclick="openDate('${n.localDate}')">열어보기</button></div>`).join(''):'<div class="empty">아직 작성한 기록이 없어요.</div>'}</div>`}
async function deleteRecord(store,id){if(!confirm('이 기록을 삭제할까요? 관련된 다른 기록은 자동으로 삭제되지 않습니다.'))return;await del(store,id);toast('삭제했어요');render()}
async function settings(v){let theme=(await get('settings','theme'))?.value||'light';let counts=await Promise.all(STORES.map(async s=>({s,n:(await all(s)).length})));v.innerHTML=heading('앱 설정','내 기록은 현재 사용 중인 브라우저·ZIP OS 저장공간에 보관돼요.')+`<div class="card"><h3>화면 설정</h3><div class="field"><label>테마</label><select id="theme" onchange="setTheme(this.value)"><option value="light" ${theme==='light'?'selected':''}>라이트</option><option value="dark" ${theme==='dark'?'selected':''}>다크</option></select></div></div><div class="card"><h3>내 데이터 백업 / 복원</h3><p class="sub" style="margin:9px 0 14px">ZIP OS 업데이트나 앱을 재설치하기 전에는 반드시 JSON을 백업하세요.</p><div class="stack">${button('전체 JSON 백업 다운로드','exportData()','full')}${button('JSON 파일 불러오기','document.getElementById(\'importFile\').click()','secondary full')}</div><p class="hint">불러오기 시 동일 ID 항목을 덮어쓰고, 기존에만 있는 기록은 유지합니다. 다른 앱에서 받은 파일은 열지 마세요.</p></div><div class="card"><h3>저장된 데이터</h3>${counts.map(c=>`<div class="row" style="padding:6px 0"><span class="sub">${esc(c.s)}</span><strong>${c.n}</strong></div>`).join('')}</div><div class="card"><h3>사용 안내</h3><p class="sub">완전 오프라인으로 동작하는 기본 큐티·실천·테스트·성찰 앱입니다. 이 버전의 샘플 시험 문제는 10개이며 성경 원문이나 자동 AI 출제 기능은 포함하지 않습니다.</p></div><p class="foot">말씀대로 · QT & LIFE v1.0<br>말씀을 읽고, 이해하고, 실천하며 돌아보기</p>`}
async function setTheme(t){await save('settings',{id:'theme',value:t});document.body.classList.toggle('dark',t==='dark');toast('테마가 변경되었어요')}
async function exportData(){try{let data={app:'malssumdaero-qt-life',schemaVersion:3,exportedAt:now(),stores:{}};for(let s of STORES)data.stores[s]=await all(s);let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`malssumdaero_backup_${today()}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('백업 파일을 만들었어요')}catch(e){toast('백업 오류: '+e.message)}}
document.getElementById('importFile').addEventListener('change',async function(){let f=this.files[0];if(!f)return;try{if(f.size>20*1024*1024)throw Error('파일이 20MB보다 커요');let data=JSON.parse(await f.text());if(data.app!=='malssumdaero-qt-life'||![1,2,3].includes(data.schemaVersion)||!data.stores||typeof data.stores!=='object')throw Error('호환되지 않는 백업입니다');let list=STORES.flatMap(s=>(data.stores[s]||[]).map(x=>[s,x]));if(list.some(([s,x])=>!STORES.includes(s)||!x||typeof x!=='object'||typeof x.id!=='string'||x.id.length>200))throw Error('백업 데이터 형식이 올바르지 않아요');if(!confirm(`총 ${list.length}개의 항목을 불러올까요? 같은 ID의 기록은 덮어씁니다.`))return;for(let [s,x] of list)await save(s,x);let theme=(await get('settings','theme'))?.value||'light';document.body.classList.toggle('dark',theme==='dark');toast('복원이 완료되었어요');render()}catch(e){alert('파일 불러오기 실패: '+e.message)}finally{this.value=''}});
(async function init(){try{db=await openDB();let theme=(await get('settings','theme'))?.value||'light';document.body.classList.toggle('dark',theme==='dark');let requested=location.hash.slice(1);route=['home','qt','presentation','questions','thoughts','practice','growth','settings','review','notes'].includes(requested)?requested:'home';await render()}catch(e){document.getElementById('view').innerHTML='<div class="card"><h2>저장소를 열 수 없습니다</h2><p class="sub">이 브라우저나 ZIP OS에서 IndexedDB가 차단되어 있을 수 있습니다. 일반 브라우저에서 다시 실행하거나 저장소 설정을 확인해 주세요.</p><p>'+esc(e.message)+'</p></div>'}})();
</script></body></html>
