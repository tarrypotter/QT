<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=yes"><meta name="theme-color" content="#f8f6f0"><title>말씀대로 · QT & LIFE</title><style>
:root{--bg:#f8f6f0;--surface:#fff;--ink:#27342d;--muted:#7b877e;--line:#e7eae3;--brand:#28624b;--soft:#e9f2e9;--gold:#d7aa70;--nav:82px}*{box-sizing:border-box}html{height:100%;-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;overscroll-behavior:none}button,input,textarea,select{font:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.5;cursor:default}.app{max-width:680px;margin:auto;min-height:100dvh;background:var(--bg)}header{position:sticky;top:0;z-index:5;background:rgba(248,246,240,.95);backdrop-filter:blur(15px);padding:calc(env(safe-area-inset-top) + 14px) 20px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(200,211,200,.45)}.eyebrow{font-size:11px;letter-spacing:1.5px;color:var(--brand);font-weight:800}.logo{font-family:Georgia,'Noto Serif KR',serif;font-size:25px;font-weight:800;letter-spacing:-1px}.iconbtn{border:1px solid var(--line);border-radius:14px;background:white;padding:10px;color:var(--ink)}main{padding:20px 18px calc(var(--nav) + env(safe-area-inset-bottom) + 28px);min-height:70vh}h1,h2,h3,p{margin:0}h1{font-size:25px;line-height:1.3;letter-spacing:-.8px}h2{font-size:19px;letter-spacing:-.5px}h3{font-size:16px}p{line-height:1.7}.sub{color:var(--muted);font-size:13px}.section{margin:22px 0 12px}.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:13px;box-shadow:0 3px 16px rgba(44,77,55,.025)}.hero{background:linear-gradient(130deg,#245a45,#41795d);border-radius:24px;padding:24px 21px;color:#fff;margin-bottom:17px}.hero .sub{color:#d8e8da}.hero h1{margin:10px 0}.hero button{background:white;color:var(--brand)}.btn{border:0;border-radius:14px;background:var(--brand);color:#fff;min-height:46px;padding:11px 15px;font-weight:750;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn.secondary{background:var(--soft);color:var(--brand)}.btn.ghost{background:#f1f3ef;color:var(--ink)}.btn.danger{background:#ffeaea;color:#a52b2b}.btn.full{width:100%}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.stack{display:grid;gap:10px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.mini{background:#f7faf6;border-radius:15px;padding:15px}.mini strong{display:block;font-size:21px;color:var(--brand);margin-bottom:4px}.pill{display:inline-block;background:var(--soft);color:var(--brand);border-radius:100px;padding:5px 10px;font-size:12px;font-weight:750}.muted{color:var(--muted)}label{font-size:13px;font-weight:750;display:block;margin-bottom:7px}.field{margin:15px 0}input,textarea,select{border:1px solid #dce3dc;background:white;color:var(--ink);border-radius:13px;width:100%;padding:12px;outline:none;min-height:45px}input:focus,textarea:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 3px #28624b18}textarea{resize:vertical;min-height:95px;line-height:1.6}textarea.large{min-height:125px}.hint{font-size:12px;color:var(--muted);margin-top:5px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:680px;display:grid;grid-template-columns:repeat(5,1fr);padding:8px 6px calc(7px + env(safe-area-inset-bottom));background:rgba(255,255,255,.97);border-top:1px solid var(--line);z-index:10;backdrop-filter:blur(14px)}.nav button{border:0;background:none;color:#94a197;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;padding:7px 2px;min-height:52px}.nav button.active{color:var(--brand);font-weight:800}.nav .sym{font-size:21px}.choice{display:block;text-align:left;width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;background:white;margin:7px 0;color:var(--ink)}.choice.selected{border-color:var(--brand);background:var(--soft)}.choice.correct{border-color:#369668;background:#e7f9ea}.choice.wrong{border-color:#ce8f8f;background:#fff0ed}.bar{height:8px;background:#e5ebe4;border-radius:10px;overflow:hidden}.bar span{display:block;height:100%;background:var(--brand)}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{border:1px solid var(--line);padding:9px 0;background:white;border-radius:11px;text-align:center;font-size:13px;color:var(--ink)}.day.mark{background:var(--soft);border-color:#96baa3;color:var(--brand);font-weight:800}.day.today{outline:2px solid var(--gold)}.record{border-left:3px solid var(--brand);padding-left:12px;margin-top:10px}.empty{text-align:center;padding:24px 10px;color:var(--muted)}.small{font-size:12px}.warning{background:#fff5e4;border-radius:13px;padding:12px;font-size:12px;color:#796340}.toast{position:fixed;left:50%;bottom:calc(95px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#263c30;color:white;padding:11px 17px;border-radius:13px;z-index:30;font-size:13px;box-shadow:0 5px 15px #0002;max-width:90vw}.hidden{display:none!important}.divider{border:0;border-top:1px solid var(--line);margin:16px 0}.checkline{display:flex;align-items:start;gap:9px;padding:10px 0}.checkline input{width:20px;min-height:20px;accent-color:var(--brand)}.checkline label{font-weight:500;margin:0}.inline{display:flex;gap:8px;flex-wrap:wrap}.inline>*{flex:1}.foot{text-align:center;font-size:11px;color:var(--muted);padding:20px 0}body.dark{--bg:#161e1a;--surface:#222c26;--ink:#edf2ed;--muted:#b4beb5;--line:#38483d;--brand:#9bd8af;--soft:#304a39}body.dark header{background:#161e1af0}body.dark input,body.dark textarea,body.dark select,body.dark .choice,body.dark .day,body.dark .iconbtn{background:var(--surface);color:var(--ink);border-color:var(--line)}body.dark .mini{background:#2b3930}body.dark .nav{background:#1d2822f5}body.dark .btn.ghost{background:#344037}body.dark .hero{background:linear-gradient(130deg,#284c37,#355b45)}@media(min-width:700px){body{background:#e9eee7}.app{box-shadow:0 5px 45px #0001}}
</style></head><body><div class="app"><header><div><div class="eyebrow">QT & LIFE</div><div class="logo">말씀대로 <span style="color:#b49b6a">✝</span></div></div><button class="iconbtn" onclick="navigate('settings')" aria-label="설정">⚙️</button></header><main id="view"></main><nav class="nav" id="nav" aria-label="하단 메뉴"></nav></div><div id="toast" class="toast hidden" role="status"></div><input type="file" id="importFile" accept="application/json,.json" class="hidden"><script>
'use strict';
const DB_NAME='malssumdaero_qt_life',VERSION=1,STORES=['settings','qtNotes','practiceGoals','practiceLogs','reflections','questions','testAttempts','challenges','prayers'];let db,route='home',state={date:today(),qt:null,goal:null,quiz:null,quizIndex:0,quizAnswers:[],testConfig:{scope:'today',type:'mixed',count:5},growthMonth:today().slice(0,7)};
function today(){let d=new Date();return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(d)}function uid(){return crypto.randomUUID?crypto.randomUUID():'id_'+Date.now()+'_'+Math.random().toString(36).slice(2)}function now(){return new Date().toISOString()}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(s){let e=document.getElementById('toast');e.textContent=s;e.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hidden'),2400)}function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DB_NAME,VERSION);r.onupgradeneeded=()=>{let d=r.result;for(let x of STORES)if(!d.objectStoreNames.contains(x))d.createObjectStore(x,{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function tx(store,mode='readonly'){return db.transaction(store,mode).objectStore(store)}function save(store,obj){return new Promise((res,rej)=>{let r=tx(store,'readwrite').put(obj);r.onsuccess=()=>res(obj);r.onerror=()=>rej(r.error)})}function all(store){return new Promise((res,rej)=>{let r=tx(store).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function get(store,id){return new Promise((res,rej)=>{let r=tx(store).get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function del(store,id){return new Promise((res,rej)=>{let r=tx(store,'readwrite').delete(id);r.onsuccess=res;r.onerror=()=>rej(r.error)})}async function byDate(store,date){return (await all(store)).filter(x=>x.localDate===date)}function formatDate(d){return `${d.slice(0,4)}.${d.slice(5,7)}.${d.slice(8,10)}`}function dateShift(date,n){let d=new Date(date+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}function heading(title,sub=''){return `<div class="section"><h1>${title}</h1>${sub?`<p class="sub">${sub}</p>`:''}</div>`}function button(t,act,kind=''){return `<button class="btn ${kind}" onclick="${act}">${t}</button>`}function navHtml(){let items=[['home','⌂','홈'],['qt','▤','큐티'],['test','✓','테스트'],['practice','♧','실천'],['growth','▥','성장']];document.getElementById('nav').innerHTML=items.map(([id,ic,t])=>`<button class="${route===id?'active':''}" onclick="navigate('${id}')"><span class="sym">${ic}</span>${t}</button>`).join('')}
function navigate(to){if(route==='qt'&&to!=='qt'&&document.getElementById('passage'))saveQT(false);route=to;history.pushState({route:to},'',location.pathname+location.search+'#'+to);render();window.scrollTo(0,0)}window.onpopstate=()=>{route=location.hash.slice(1)||'home';render()};async function render(){navHtml();let v=document.getElementById('view');try{if(route==='home')await home(v);else if(route==='qt')await qt(v);else if(route==='test')await test(v);else if(route==='practice')await practice(v);else if(route==='growth')await growth(v);else if(route==='settings')await settings(v);else if(route==='review')await review(v);else if(route==='notes')await notes(v);else navigate('home')}catch(e){console.error(e);v.innerHTML=`<div class="card"><h2>화면을 여는 중 문제가 발생했습니다</h2><p class="sub">${esc(e.message)}</p>${button('다시 열기','render()','secondary')}</div>`}}
const defaults={observation:'',interpretation:'',reflection:'',application:'',prayer:''};async function currentNote(){let a=await byDate('qtNotes',state.date);return a.sort((x,y)=>y.updatedAt.localeCompare(x.updatedAt))[0]||null}async function currentGoal(){let a=await byDate('practiceGoals',state.date);return a[0]||null}
async function home(v){let notes=await byDate('qtNotes',today()),goals=await byDate('practiceGoals',today()),refl=await byDate('reflections',today()),tests=await byDate('testAttempts',today());let n=notes[0],g=goals[0];v.innerHTML=`<p class="sub">${formatDate(today())} · 오늘도 말씀과 함께</p><div class="hero"><div class="sub">오늘의 여정</div><h1>말씀을 읽고,<br>삶에서 한 걸음 실천해요.</h1><p class="sub" style="margin-bottom:16px">기록의 양보다 마음을 돌아보는 시간이 중요해요.</p>${button(n?'오늘의 큐티 이어쓰기 →':'오늘의 큐티 시작 →',"navigate('qt')")}</div><div class="grid3"><div class="mini"><strong>${notes.length}</strong><span class="small muted">오늘 큐티</span></div><div class="mini"><strong>${tests.length}</strong><span class="small muted">학습 시험</span></div><div class="mini"><strong>${refl.length}</strong><span class="small muted">하루 점검</span></div></div><h2 class="section">오늘의 실천</h2><div class="card">${g?`<span class="pill">${esc(g.statusLabel||'실천 중')}</span><h3 style="margin:11px 0">${esc(g.title)}</h3><p class="sub">연결 본문: ${esc(g.passageRef||'없음')}</p>${button('실천 기록하기',"navigate('practice')",'secondary full')}`:`<p class="sub" style="margin-bottom:13px">큐티에서 삶에 적용할 작은 행동을 정해보세요.</p>${button('실천 목표 만들기',"navigate('practice')",'secondary full')}`}</div><h2 class="section">저녁에 돌아보기</h2><div class="card"><p class="sub" style="margin-bottom:13px">오늘 배운 말씀은 어떤 순간에 생각났나요? 어려웠던 순간도 정직하게 기록해요.</p>${button(refl.length?'점검 기록 다시 보기':'하루 점검 작성',"navigate('review')",'secondary full')}</div><div class="card"><div class="row"><h3>최근 큐티</h3>${button('전체 기록',"navigate('notes')",'ghost')}</div><div id="recentNotes" class="sub" style="margin-top:10px">${n?`${esc(n.passageRef||'본문 미지정')} · ${esc((n.note?.reflection||n.note?.observation||'작성 중').slice(0,65))}`:'아직 기록이 없어요.'}</div></div>`}
async function qt(v){let n=await currentNote();let note=n?.note||defaults;v.innerHTML=heading('큐티노트','말씀을 관찰하고, 해석하고, 나의 삶에 적용해요.')+`<div class="card"><div class="row"><h3>묵상 날짜</h3><input type="date" style="max-width:172px" value="${state.date}" onchange="changeDate(this.value)"></div><div class="field"><label>오늘 묵상할 성경 본문</label><input id="passage" placeholder="예: 야고보서 1:19-20" value="${esc(n?.passageRef||'')}"><p class="hint">성경 본문은 사용 중인 성경에서 읽고, 참조 구절을 입력하세요.</p></div>${[['observation','① 관찰 · 본문에 어떤 내용이 있나요?'],['interpretation','② 해석 · 본문은 무엇을 의미하나요?'],['reflection','③ 성찰 · 내 모습과 연결되는 부분은?'],['application','④ 적용 · 오늘 구체적으로 무엇을 할까요?'],['prayer','⑤ 기도 · 하나님께 드리는 기도']].map(([key,label])=>`<div class="field"><label for="${key}">${label}</label><textarea id="${key}" oninput="scheduleQTSave()" placeholder="자유롭게 기록해보세요.">${esc(note[key])}</textarea></div>`).join('')}<div class="row"><span class="sub" id="saveStatus">작성 내용은 자동 저장됩니다.</span>${button('저장하기','saveQT(true)')}</div></div><div class="card"><h3>큐티를 실천으로 연결하기</h3><p class="sub" style="margin:9px 0 13px">적용란에 적은 내용을 실천 목표로 가져올 수 있어요.</p>${button('적용 내용 → 오늘 실천 목표', 'fromQT()','secondary full')}</div><div class="card warning">이 앱은 성경 번역 본문을 무단 수록하지 않아요. 사용자가 소유한 성경 또는 정식 제공처에서 본문을 읽고 묵상 내용을 기록할 수 있습니다.</div>`;document.getElementById('passage').addEventListener('input',scheduleQTSave)}function changeDate(d){if(!d)return;state.date=d;render()}let qtTimer;function scheduleQTSave(){document.getElementById('saveStatus').textContent='저장 중…';clearTimeout(qtTimer);qtTimer=setTimeout(()=>saveQT(false),650)}async function saveQT(show){clearTimeout(qtTimer);if(route!=='qt')return;let passageRef=document.getElementById('passage')?.value.trim()||'';let note=Object.fromEntries(Object.keys(defaults).map(k=>[k,document.getElementById(k)?.value||'']));let existing=await currentNote();if(!passageRef&&!Object.values(note).some(s=>s.trim())){if(show)toast('본문이나 묵상 내용을 먼저 입력하세요');return}let item={id:existing?.id||uid(),localDate:state.date,passageRef,note,createdAt:existing?.createdAt||now(),updatedAt:now()};await save('qtNotes',item);let status=document.getElementById('saveStatus');if(status)status.textContent='✓ 저장됨';if(show)toast('큐티가 저장되었어요')}async function fromQT(){await saveQT(false);let n=await currentNote();if(!n?.note?.application.trim()){toast('큐티의 적용 내용을 먼저 입력하세요');return}let old=await currentGoal();await save('practiceGoals',{id:old?.id||uid(),qtId:n.id,localDate:state.date,title:n.note.application.trim(),passageRef:n.passageRef,status:old?.status||'planned',createdAt:old?.createdAt||now(),updatedAt:now()});toast('실천 목표를 만들었어요');navigate('practice')}
const BANK=[{ref:'야고보서 1:19-20',q:'야고보서 1:19에서 권면하는 태도는?',opts:['듣기는 더디, 말하기는 속히','듣기는 속히, 말하기는 더디','모든 사람에게 침묵하기'],a:1,ex:'본문은 경청과 말을 절제하는 태도, 성내기를 더디 하라고 권면합니다.',type:'choice'},{ref:'야고보서 1:19-20',q:'다른 사람과 의견이 충돌할 때 본문에 가까운 적용은?',opts:['반박부터 한다','상대의 말을 먼저 듣고 차분히 답한다','상대방을 무시한다'],a:1,ex:'경청과 절제를 구체적인 행동으로 연결하는 예입니다.',type:'scenario'},{ref:'빌립보서 4:6-7',q:'빌립보서 4장 6절이 걱정과 관련하여 권면하는 행동은?',opts:['염려를 혼자 감추기','기도와 간구로 하나님께 아뢰기','걱정하는 사람을 꾸짖기'],a:1,ex:'기도와 간구, 감사의 태도로 하나님께 아뢰라는 권면입니다.',type:'choice'},{ref:'에베소서 4:32',q:'에베소서 4장 32절에 나타난 관계의 태도는?',opts:['친절과 불쌍히 여김, 용서','어떤 상황이든 무조건 참기','모든 사람과의 거리 두기'],a:0,ex:'서로 친절하고 불쌍히 여기며 용서하라는 권면입니다.',type:'choice'},{ref:'데살로니가전서 5:18',q:'데살로니가전서 5장 18절의 핵심 권면은?',opts:['모든 일을 쉽게 여기기','범사에 감사하기','감정 표현을 하지 않기'],a:1,ex:'본문의 핵심 권면은 범사에 감사하는 것입니다.',type:'choice'},{ref:'누가복음 10:33-37',q:'선한 사마리아인 비유와 가장 가까운 실천은?',opts:['도움이 필요한 이웃을 돌본다','어려운 사람을 피해 간다','겉모습만으로 판단한다'],a:0,ex:'도움이 필요한 이웃에게 자비를 베푸는 행동을 생각해볼 수 있습니다.',type:'scenario'},{ref:'미가 6:8',q:'미가 6:8의 권면에 포함되는 것은?',opts:['정의를 행하고 인애를 사랑하기','남을 이기기','재물을 많이 모으기'],a:0,ex:'정의를 행하고 인애를 사랑하며 겸손히 하나님과 동행하는 삶을 말합니다.',type:'choice'},{ref:'골로새서 3:13',q:'누군가에게 불평할 일이 생겼을 때 본문이 권면하는 태도는?',opts:['용납하고 용서하기','마음을 닫고 단절하기','똑같이 되갚기'],a:0,ex:'서로 용납하고 용서하라는 권면이 담겨 있습니다.',type:'scenario'},{ref:'잠언 15:1',q:'잠언 15:1은 어떤 대답에 관해 말하나요?',opts:['과격한 대답','유순한 대답','늦은 대답만'],a:1,ex:'유순한 대답이 분노를 쉬게 한다는 지혜를 가르칩니다.',type:'choice'},{ref:'시편 119:105',q:'시편 119:105에서 말씀은 무엇에 비유되나요?',opts:['발의 등과 길의 빛','높은 성벽','무거운 짐'],a:0,ex:'말씀을 발의 등과 길의 빛에 비유합니다.',type:'choice'}];function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
async function test(v){v.innerHTML=heading('말씀 이해도 테스트','기억한 지식과 삶의 적용을 함께 돌아봐요.')+`<div class="card"><div class="field"><label>1. 시험 말씀 범위</label><select id="scope"><option value="today">오늘 큐티 말씀</option><option value="recent">최근 7일 큐티</option><option value="all">전체 준비된 문제은행</option></select></div><div class="field"><label>2. 시험 방식</label><select id="quizType"><option value="mixed">종합 시험</option><option value="choice">본문 이해 중심</option><option value="scenario">상황별 말씀 적용</option></select></div><div class="field"><label>3. 문제 수</label><select id="count"><option value="3">3문제</option><option value="5" selected>5문제</option><option value="10">10문제</option></select></div><p class="hint">현재 버전은 검토된 샘플 문제은행 10문항을 제공합니다. 준비되지 않은 본문은 문제를 만들어낸 것처럼 표시하지 않습니다.</p><div style="margin-top:15px">${button('시험 시작','startQuiz()','full')}</div></div><h2 class="section">최근 시험 기록</h2><div class="card" id="testsHistory">불러오는 중…</div>`;let tries=(await all('testAttempts')).sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).slice(0,6);document.getElementById('testsHistory').innerHTML=tries.length?tries.map(t=>`<div class="row" style="padding:9px 0;border-bottom:1px solid var(--line)"><span class="sub">${esc(t.localDate)} · ${esc(t.scope)}</span><strong>${t.correct}/${t.total}</strong></div>`).join(''):'<p class="sub">아직 응시 기록이 없어요.</p>'}
async function startQuiz(){let scope=document.getElementById('scope').value,type=document.getElementById('quizType').value,count=+document.getElementById('count').value;let pool=BANK.filter(q=>type==='mixed'||q.type===type);if(scope!=='all'){let days=scope==='today'?[today()]:Array.from({length:7},(_,i)=>dateShift(today(),-i));let notes=(await all('qtNotes')).filter(n=>days.includes(n.localDate));pool=pool.filter(q=>notes.some(n=>n.passageRef.replaceAll(/\s/g,'').includes(q.ref.replaceAll(/\s/g,''))||q.ref.replaceAll(/\s/g,'').includes(n.passageRef.replaceAll(/\s/g,''))&&n.passageRef.length>4))}if(!pool.length){toast('이 범위에 준비된 문제가 없어요. 전체 문제은행을 선택하세요.');return}state.quiz={scope,type,items:shuffle(pool).slice(0,count),startedAt:now()};state.quizIndex=0;state.quizAnswers=[];renderQuiz()}function renderQuiz(){route='quiz';navHtml();let quiz=state.quiz;if(!quiz){navigate('test');return}let i=state.quizIndex,q=quiz.items[i];document.getElementById('view').innerHTML=`<div class="row"><h2>말씀 이해도 테스트</h2><span class="pill">${i+1} / ${quiz.items.length}</span></div><div class="bar" style="margin:17px 0"><span style="width:${(i+1)/quiz.items.length*100}%"></span></div><div class="card"><span class="sub">${esc(q.ref)}</span><h2 style="margin:13px 0 20px">${esc(q.q)}</h2>${q.opts.map((o,j)=>`<button class="choice" id="ans${j}" onclick="answerQuiz(${j})">${j+1}. ${esc(o)}</button>`).join('')}<div id="feedback"></div><div id="nextButton"></div></div>`}function answerQuiz(j){let q=state.quiz.items[state.quizIndex];if(state.quizAnswers[state.quizIndex]!==undefined)return;state.quizAnswers[state.quizIndex]=j;q.opts.forEach((_,k)=>{let e=document.getElementById('ans'+k);e.disabled=true;if(k===q.a)e.classList.add('correct');if(k===j&&k!==q.a)e.classList.add('wrong')});document.getElementById('feedback').innerHTML=`<div class="mini" style="margin-top:14px"><strong style="font-size:15px">${j===q.a?'정답이에요!':'다시 복습해보세요.'}</strong><p class="sub">${esc(q.ex)}</p></div>`;document.getElement async function practice(v){let goal=await currentGoal(),logs=(await byDate('practiceLogs',state.date)).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));v.innerHTML=heading('말씀 실천','작은 행동을 정하고 실제 경험을 기록해요.')+`<div class="card"><div class="row"><h3>오늘의 실천 목표</h3><input type="date" style="max-width:155px" value="${state.date}" onchange="changeDate(this.value)"></div><div class="field"><label>오늘 말씀대로 실천할 행동</label><textarea id="goalTitle" placeholder="예: 상대방의 이야기를 끝까지 듣겠습니다.">${esc(goal?.title||'')}</textarea></div><div class="field"><label>연결된 성경 구절</label><input id="goalRef" placeholder="예: 야고보서 1:19-20" value="${esc(goal?.passageRef||'')}"></div>${button('실천 목표 저장','saveGoal()','full')}</div><div class="card"><h3>오늘의 실천 돌아보기</h3><p class="sub" style="margin:7px 0 12px">잘하지 못한 날에도 정직하게 기록하면 좋아요.</p><div class="field"><label>실천 상태</label><select id="logStatus"><option value="done">말씀을 기억하며 실천했어요</option><option value="attempted">노력했지만 일부 어려웠어요</option><option value="difficult">실천하기 어려웠어요</option><option value="later">아직 기회가 없었어요</option></select></div><div class="field"><label>어떤 상황에서 어떻게 행동했나요?</label><textarea id="logText" placeholder="실제 있었던 상황과 내 행동을 적어보세요."></textarea></div>${button('실천 기록 추가','saveLog()','full secondary')}</div><h2 class="section">오늘의 실천 기록</h2><div class="card">${logs.length?logs.map(x=>`<div class="record"><div class="row"><span class="pill">${esc(statusName(x.status))}</span><button class="iconbtn" onclick="deleteRecord('practiceLogs','${x.id}')" aria-label="기록 삭제">✕</button></div><p style="margin-top:8px">${esc(x.text||'내용 없음')}</p><span class="sub">${new Date(x.createdAt).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}</span></div>`).join(''):'<div class="empty">아직 실천 기록이 없어요.</div>'}</div>${button('저녁 하루 점검하기','navigate(\'review\')','full')}`}

async function growth(v){let [notes,logs,tries,reviews]=await Promise.all(['qtNotes','practiceLogs','testAttempts','reflections'].map(all));let month=state.growthMonth,monthly=notes.filter(x=>x.localDate.startsWith(month)),monthlyLogs=logs.filter(x=>x.localDate.startsWith(month)),monthlyTests=tries.filter(x=>x.localDate.startsWith(month));let [year,m]=month.split('-').map(Number),first=new Date(Date.UTC(year,m-1,1)).getUTCDay(),days=new Date(Date.UTC(year,m,0)).getUTCDate();let cells=Array.from({length:first},()=>'<div></div>');for(let d=1;d<=days;d++){let date=`${month}-${String(d).padStart(2,'0')}`,marked=notes.some(n=>n.localDate===date);cells.push(`<button class="day ${marked?'mark':''} ${date===today()?'today':''}" onclick="openDate('${date}')">${d}${marked?' ·':''}</button>`)}let archive=[...notes].sort((a,b)=>b.localDate.localeCompare(a.localDate));v.innerHTML=heading('성장 기록','결과보다 꾸준한 성찰과 삶의 변화를 발견해요.')+`<div class="grid3"><div class="mini"><strong>${monthly.length}</strong><span class="small muted">이달 큐티</span></div><div class="mini"><strong>${monthlyLogs.length}</strong><span class="small muted">실천 기록</span></div><div class="mini"><strong>${monthlyTests.length}</strong><span class="small muted">말씀 시험</span></div></div><div class="card" style="margin-top:15px"><div class="row" style="margin-bottom:16px"><button class="iconbtn" onclick="monthShift(-1)">〈</button><h3>${year}년 ${m}월</h3><button class="iconbtn" onclick="monthShift(1)">〉</button></div><div class="days" style="margin-bottom:9px">${['일','월','화','수','목','금','토'].map(s=>`<div class="sub" style="text-align:center">${s}</div>`).join('')}</div><div class="days">${cells.join('')}</div><p class="hint">초록색은 큐티를 기록한 날입니다. 날짜를 누르면 해당 날짜 기록으로 이동해요.</p></div><div class="card"><h3>나의 기록 돌아보기</h3>${archive.length?archive.slice(0,15).map(n=>`<button class="choice" onclick="openDate('${n.localDate}')"><strong>${esc(n.localDate)}</strong><p class="sub">${esc(n.passageRef||'본문 미지정')} · ${esc((n.note?.reflection||n. async function notes(v){let a=(await all('qtNotes')).sort((x,y)=>y.localDate.localeCompare(x.localDate));v.innerHTML=heading('큐티 기록 보관함','작성한 큐티를 날짜별로 다시 볼 수 있어요.')+`<div class="card">${a.length?a.map(n=>`<div class="record"><div class="row"><strong>${esc(n.localDate)} · ${esc(n.passageRef||'본문 미지정')}</strong><button class="iconbtn" onclick="deleteRecord('qtNotes','${n.id}')">✕</button></div><p class="sub">${esc((n.note?.reflection||n.note?.observation||'기록 내용 없음').slice(0,110))}</p><button class="btn secondary" style="margin-top:9px" onclick="openDate('${n.localDate}')">열어보기</button></div>`).join(''):'<div class="empty">아직 작성한 기록이 없어요.</div>'}</div>`}
async function deleteRecord(store,id){if(!confirm('이 기록을 삭제할까요? 관련된 다른 기록은 자동으로 삭제되지 않습니다.'))return;await del(store,id);toast('삭제했어요');render()}
async function settings(v){let theme=(await get('settings','theme'))?.value||'light';let counts=await Promise.all(STORES.map(async s=>({s,n:(await all(s)).length})));v.innerHTML=heading('앱 설정','내 기록은 현재 사용 중인 브라우저·ZIP OS 저장공간에 보관돼요.')+`<div class="card"><h3>화면 설정</h3><div class="field"><label>테마</label><select id="theme" onchange="setTheme(this.value)"><option value="light" ${theme==='light'?'selected':''}>라이트</option><option value="dark" ${theme==='dark'?'selected':''}>다크</option></select></div></div><div class="card"><h3>내 데이터 백업 / 복원</h3><p class="sub" style="margin:9px 0 14px">ZIP OS 업데이트나 앱을 재설치하기 전에는 반드시 JSON을 백업하세요.</p><div class="stack">${button('전체 JSON 백업 다운로드','exportData()','full')}${button('JSON 파일 불러오기','document.getElementById(\'importFile\').click()','secondary full')}</div><p class="hint">불러오기 시 동일 ID 항목을 덮어쓰고, 기존에만 있는 기록은 유지합니다. 다른 앱에서 받은 파일은 열지 마세요.</p></div><div class="card"><h3>저장된 데이터</h3>${counts.map(c=>`<div class="row" style="padding:6px 0"><span class="sub">${esc(c.s)}</span><strong>${c.n}</strong></div>`).join('')}</div><div class="card"><h3>사용 안내</h3><p class="sub">완전 오프라인으로 동작하는 기본 큐티·실천·테스트·성찰 앱입니다. 이 버전의 샘플 시험 문제는 10개이며 성경 원문이나 자동 AI 출제 기능은 포함하지 않습니다.</p></div><p class="foot">말씀대로 · QT & LIFE v1.0<br>말씀을 읽고, 이해하고, 실천하며 돌아보기</p>`}
async function setTheme(t){await save('settings',{id:'theme',value:t});document.body.classList.toggle('dark',t==='dark');toast('테마가 변경되었어요')}
async function exportData(){try{let data={app:'malssumdaero-qt-life',schemaVersion:1,exportedAt:now(),stores:{}};for(let s of STORES)data.stores[s]=await all(s);let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`malssumdaero_backup_${today()}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('백업 파일을 만들었어요')}catch(e){toast('백업 오류: '+e.message)}}
document.getElementById('importFile').addEventListener('change',async function(){let f=this.files[0];if(!f)return;try{if(f.size>20*1024*1024)throw Error('파일이 20MB보다 커요');let data=JSON.parse(await f.text());if(data.app!=='malssumdaero-qt-life'||data.schemaVersion!==1||!data.stores||typeof data.stores!=='object')throw Error('호환되지 않는 백업입니다');let list=STORES.flatMap(s=>(data.stores[s]||[]).map(x=>[s,x]));if(list.some(([s,x])=>!STORES.includes(s)||!x||typeof x!=='object'||typeof x.id!=='string'||x.id.length>200))throw Error('백업 데이터 형식이 올바르지 않아요');if(!confirm(`총 ${list.length}개의 항목을 불러올까요? 같은 ID의 기록은 덮어씁니다.`))return;for(let [s,x] of list)await save(s,x);let theme=(await get('settings','theme'))?.value||'light';document.body.classList.toggle('dark',theme==='dark');toast('복원이 완료되었어요');render()}catch(e){alert('파일 불러오기 실패: '+e.message)}finally{this.value=''}});
(async function init(){try{db=await openDB();let theme=(await get('settings','theme'))?.value||'light';document.body.classList.toggle('dark',theme==='dark');let requested=location.hash.slice(1);route=['home','qt','test','practice','growth','settings','review','notes'].includes(requested)?requested:'home';await render()}catch(e){document.getElementById('view').innerHTML='<div class="card"><h2>저장소를 열 수 없습니다</h2><p class="sub">이 브라우저나 ZIP OS에서 IndexedDB가 차단되어 있을 수 있습니다. 일반 브라우저에서 다시 실행하거나 저장소 설정을 확인해 주세요.</p><p>'+esc(e.message)+'</p></div>'}})();
</script></body></html>
