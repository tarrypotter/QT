async function startQuiz(){let scope=document.getElementById('scope').value,type=document.getElementById('quizType').value,count=+document.getElementById('count').value;let pool=BANK.filter(q=>type==='mixed'||q.type===type);if(scope!=='all'){let days=scope==='today'?[today()]:Array.from({length:7},(_,i)=>dateShift(today(),-i));let notes=(await all('qtNotes')).filter(n=>days.includes(n.localDate));pool=pool.filter(q=>notes.some(n=>n.passageRef.replaceAll(/\s/g,'').includes(q.ref.replaceAll(/\s/g,''))||q.ref.replaceAll(/\s/g,'').includes(n.passageRef.replaceAll(/\s/g,''))&&n.passageRef.length>4))}if(!pool.length){toast('이 범위에 준비된 문제가 없어요. 전체 문제은행을 선택하세요.');return}state.quiz={scope,type,items:shuffle(pool).slice(0,count),startedAt:now()};state.quizIndex=0;state.quizAnswers=[];renderQuiz()}function renderQuiz(){route='quiz';navHtml();let quiz=state.quiz;if(!quiz){navigate('test');return}let i=state.quizIndex,q=quiz.items[i];document.getElementById('view').innerHTML=`<div class="row"><h2>말씀 이해도 테스트</h2><span class="pill">${i+1} / ${quiz.items.length}</span></div><div class="bar" style="margin:17px 0"><span style="width:${(i+1)/quiz.items.length*100}%"></span></div><div class="card"><span class="sub">${esc(q.ref)}</span><h2 style="margin:13px 0 20px">${esc(q.q)}</h2>${q.opts.map((o,j)=>`<button class="choice" id="ans${j}" onclick="answerQuiz(${j})">${j+1}. ${esc(o)}</button>`).join('')}<div id="feedback"></div><div id="nextButton"></div></div>`}function answerQuiz(j){let q=state.quiz.items[state.quizIndex];if(state.quizAnswers[state.quizIndex]!==undefined)return;state.quizAnswers[state.quizIndex]=j;q.opts.forEach((_,k)=>{let e=document.getElementById('ans'+k);e.disabled=true;if(k===q.a)e.classList.add('correct');if(k===j&&k!==q.a)e.classList.add('wrong')});document.getElementById('feedback').innerHTML=`<div class="mini" style="margin-top:14px"><strong style="font-size:15px">${j===q.a?'정답이에요!':'다시 복습해보세요.'}</strong><p class="sub">${esc(q.ex)}</p></div>`;document.getElement const BACKUP_APP='malssumdaero-qt-life';
let pendingRestore=null;
async function collectData(){const stores={};for(const name of STORES)stores[name]=await all(name);return {app:BACKUP_APP,schemaVersion:4,exportedAt:now(),stores}}
function countRecords(d){return STORES.reduce((a,s)=>a+(d.stores[s]||[]).length,0)}
function payloadString(d){return JSON.stringify({app:d.app,schemaVersion:d.schemaVersion,exportedAt:d.exportedAt,stores:d.stores})}
async function digest(d){if(!crypto?.subtle)return null;const bytes=new TextEncoder().encode(payloadString(d));const hash=await crypto.subtle.digest('SHA-256',bytes);return [...new Uint8Array(hash)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function downloadBackup(d,prefix='malssumdaero_backup'){
 const copy=JSON.parse(JSON.stringify(d));copy.integrity={algorithm:'SHA-256',hash:await digest(copy)};
 const blob=new Blob([JSON.stringify(copy,null,2)],{type:'application/json;charset=utf-8'});
 const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;
 a.download=`${prefix}_${today()}_${new Date().toISOString().slice(11,19).replace(/:/g,'')}.json`;
 document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);
 await save('settings',{id:'backupLastAttempt',value:now(),records:countRecords(copy)});
 return copy;
}

async function validateBackup(d){
 if(!d||d.app!==BACKUP_APP||![1,2,3,4].includes(d.schemaVersion)||!d.stores||typeof d.stores!=='object'||Array.isArray(d.stores))throw Error('이 앱의 호환 가능한 백업이 아니에요.');
 const invalid=Object.keys(d.stores).filter(k=>!STORES.includes(k));if(invalid.length)throw Error('알 수 없는 데이터 항목이 있어요: '+invalid.join(', '));
 for(const key of STORES){const list=d.stores[key]||[];if(!Array.isArray(list))throw Error(key+' 데이터 형식 오류');let ids=new Set();for(const item of list){if(!item||typeof item!=='object'||Array.isArray(item)||typeof item.id!=='string'||!item.id||item.id.length>200||ids.has(item.id))throw Error(key+' 항목 ID가 잘못되었거나 중복됐어요');ids.add(item.id)}}
 if(d.integrity?.hash){let computed=await digest(d);if(!computed)throw Error('이 기기에서 백업 무결성을 확인할 수 없어요. HTTPS 또는 호환되는 브라우저에서 복원해 주세요.');if(computed!==d.integrity.hash)throw Error('백업 파일의 내용이 변경되거나 손상된 것으로 보여요. 복원을 중단했어요.')}
 return true;
}
async function makeSafetySnapshot(){
 const data=await collectData(),id='snapshot_'+now(),entry={id,createdAt:now(),data};
 try{await save('safetySnapshots',entry);let a=(await all('safetySnapshots')).sort((x,y)=>y.createdAt.localeCompare(x.createdAt));for(let old of a.slice(3))await del('safetySnapshots',old.id);return true}catch(e){console.warn('안전 스냅샷 생성 실패',e);throw Error('복원 전 안전 저장본을 만들지 못했어요. 저장 공간을 확인해 주세요. '+e.message)}
}
async function applyRestore(mode){
 const data=pendingRestore;if(!data)return toast('불러올 백업을 먼저 선택해 주세요.');
 if(!confirm(mode==='missing'?'현재 기록은 유지하고, 없는 기록만 추가할까요?':'동일 ID 기록은 백업 내용으로 교체할까요? 복원 전 안전 저장본을 남깁니다.'))return;
 try{
   await makeSafetySnapshot();
   const txr=db.transaction(STORES,'readwrite');let added=0,skipped=0;
   const done=new Promise((resolve,reject)=>{txr.oncomplete=resolve;txr.onabort=()=>reject(txr.error||Error('복원 트랜잭션이 중단됐어요'));txr.onerror=()=>reject(txr.error||Error('복원 실패'))});
   for(const store of STORES){const os=txr.objectStore(store);for(const x of data.stores[store]||[]){if(mode==='missing'){
     const current=await new Promise((resolve,reject)=>{const req=os.get(x.id);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});
     if(current){skipped++;continue}
   }os.put(x);added++}}
   await done;
   pendingRestore=null;let theme=(await get('settings','theme'))?.value||'light';document.body.classList.toggle('dark',theme==='dark');toast(`복원 완료: ${added}개 반영, ${skipped}개 유지`);await render();
 }catch(e){alert('복원이 완료되지 않았어요: '+e.message)}
}
async function restoreSafety(id){if(!confirm('이 안전 저장본의 기록을 현재 데이터에 덮어쓸까요? 현재 기록도 다시 안전 저장됩니다.'))return;try{const item=await get('safetySnapshots',id);if(!item)throw Error('안전 저장본이 없어요');await validateBackup(item.data);const old=pendingRestore;pendingRestore=item.data;await applyRestore('overwrite');pendingRestore=old}catch(e){alert(e.message)}}

iv><div class="help-step"><strong>③ 설치 또는 추가</strong><br>안내에 따라 설치/추가하면 홈 화면에 QT 노트 모양의 전용 아이콘이 나타납니다. 설치 방식에 따라 브라우저 화면이 보일 수도 있습니다.</div></div><div class="card"><h3>ZIP OS와 웹 배포의 차이</h3><p>이 ZIP에는 전용 앱 아이콘과 웹 앱 매니페스트가 포함돼 있습니다. <strong>일반 웹 주소로 배포했을 때</strong> 브라우저가 해당 파일을 읽어 홈 화면 아이콘과 앱 표시 방식을 결정합니다.</p><p>ZIP OS는 자체 홈 화면과 아이콘 등록 규칙을 사용할 수 있어 HTML의 아이콘 설정만으로 ZIP OS 목록 아이콘이 자동으로 바뀌지는 않습니다. ZIP OS의 앱 등록 색상·아이콘 설정도 확인하세요.</p><p><strong>주의:</strong> 홈 화면 추가가 클라우드 백업을 제공하는 것은 아닙니다. 홈 화면 바로가기를 지우거나 브라우저 저장 공간이 변경되면 기록에 접근할 수 없게 될 수 있으므로 JSON 백업을 별도로 보관하세요.</p></div><div class="card"><h3>전체 앱 사용법</h3><div class="help-step"><strong>홈</strong> · 오늘의 흐름과 최근 큐티를 확인합니다.</div><div class="help-step"><strong>큐티</strong> · 날짜, 제목, 본문, 내용, 느낀 점, 적용점, 기도를 작성하고 이전 노트를 검색·수정합니다.</div><div class="help-step"><strong>질문</strong> · 말씀을 읽고 생긴 질문과 스스로의 답을 남기고 다시 찾아봅니다.</div><div class="help-step"><strong>생각노트</strong> · 형식에 얽매이지 않고 생각이나 설교 필기를 자유롭게 남깁니다.</div><div class="help-step"><strong>발표문</strong> · 제목, 본문, 내용으로 발표 원고를 정리합니다.</div><div class="help-step"><strong>실천</strong> · 실천할 내용을 하나씩 추가하고 날짜별로 체크합니다.</div><div class="help-step"><strong>성장</strong> · 월간·연간 큐티와 실천 기록을 돌아봅니다. 통계가 신앙의 가치를 판정하지는 않습니다.</div><div class="help-step"><strong>미리보기·공유</strong> · 특정 날짜를 선택하고 포함 항목을 골라서 PDF·PNG·HTML로 저장하거나 공유합니다.</div><div class="help-step"><strong>설정</strong> · 테마 변경, JSON 전체 백업과 복원, 안전 저장본을 관리합니다.</div></div><div class="card"><h3>자주 묻는 질문</h3><p><strong>앱을 업데이트하면 데이터는 유지되나요?</strong><br>저장소가 유지되는 업데이트는 보통 그대로지만 ZIP OS 가져오기 방식이나 브라우저 출처 변경으로 달라질 수 있습니다. 업데이트 전에도 JSON을 백업하세요.</p><p><strong>한 번 백업하면 새 기록도 자동 저장되나요?</strong><br>아니요. 백업 파일은 내려받은 시점의 스냅샷입니다. 주기적으로 새 파일을 만들어 주세요.</p><p><strong>사진·PDF 공유 파일로 복원되나요?</strong><br>아니요. 전체 복원은 앱에서 내보낸 JSON 파일이 필요합니다.</p></div>`}
function showLaunchNotice(){if(document.getElementById('launchNotice'))return;const el=document.createElement('div');el.id='launchNotice';el.className='notice-overlay';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');el.setAttribute('aria-label','기록 보관 안내');el.innerHTML=`<div class="notice-card"><div class="eyebrow">시작 전 꼭 확인하세요</div><h2>⚠️ 소중한 큐티 기록을 지켜 주세요</h2><p>${GUIDE_TEXT.warning}</p><p><strong>전체 복원이 필요하다면 JSON 백업을 내려받아 앱 외부에 보관해야 합니다.</strong> 하루 공유용 이미지·PDF·HTML 파일만으로는 앱 기록을 복원할 수 없습니다.</p><p>설정의 <strong>전체 JSON 백업</strong>을 저장하고 파일 앱·iCloud Drive·PC 등에 실제로 보관하세요. iPhone·Android 홈 화면 추가 방법은 상단 <strong>?</strong> 도움말에서 볼 수 있습니다. 복원할 때는 같은 JSON을 불러오면 됩니다. 백업 후 새로 쓴 내용은 다시 백업해야 합니다.</p><div class="stack"><button class="btn full" id="noticeBackup">설정에서 JSON 백업하기</button><button class="btn secondary full" id="noticeHelp">자세한 도움말</button><button class="btn ghost full" id="noticeClose">내용 확인했어요 · 앱 시작</button></div></div>`;document.body.append(el);const close=()=>el.remove();el.querySelector('#noticeClose').onclick=close;el.querySelector('#noticeBackup').onclick=()=>{close();navigate('settings')};el.querySelector('#noticeHelp').onclick=()=>{close();navigate('helpGuide')}}

function shareClean(str){return String(str??'').trim()}
function reportLine(k,v){return v?{label:k,text:shareClean(v)}:null}
function shareRecordDate(x){
 const raw=x?.localDate||x?.date||'';
 if(/^\d{4}-\d{2}-\d{2}$/.test(raw))return raw;
 const timestamp=x?.createdAt||x?.updatedAt;
 if(!timestamp)return '';
 const d=new Date(timestamp);return Number.isNaN(d.getTime())?'':new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(d);
}
async function shareAvailableDates(){
 const names=['qtNotes','qtQuestions','thoughtNotes','presentations','practiceGoals','practiceLogs','reflections','prayers'];
 const records=await Promise.all(names.map(all));
 return [...new Set(records.flat().map(shareRecordDate).filter(Boolean))].sort((a,b)=>b.localeCompare(a));
}
async function collectShare(date){
 const [qt,questions,thoughts,presentations,goals,logs,reflections,prayers]=await Promise.all(['qtNotes','qtQuestions','thoughtNotes','presentations','practiceGoals','practiceLogs','reflections','prayers'].map(all));
 const onDate=list=>list.filter(x=>shareRecordDate(x)===date);
 const notes=onDate(qt).sort((a,b)=>String(a.createdAt||'').localeCompare(String(b.createdAt||'')));
 const qs=onDate(questions),ts=onDate(thoughts),ps=onDate(presentations);
 const logDay=onDate(logs);
 // Keep all goals active on this date, including those later archived; historic checks remain visible.
 const active=goals.filter(g=>{const start=shareRecordDate(g);return start&&start<=date&&(!g.endDate||g.endDate>=date)&&(g.active!==false||logDay.some(l=>l.goalId===g.id)||start===date)});
 const entries=active.map(g=>({goal:g,log:logDay.filter(x=>x.goalId===g.id).sort((a,b)=>String(b.updatedAt||'').localeCompare(String(a.updatedAt||'')))[0]||null}));
 for(const log of logDay){if(!entries.some(x=>x.goal.id===log.goalId))entries.push({goal:{id:log.goalId,title:'이전 실천 기록'},log});}
 return {date,qt:notes,questions:qs,thoughts:ts,presentation:ps,practice:entries,reflections:onDate(reflections).filter(r=>!r.period||r.period==='day'),prayers:onDate(prayers)};
}
function buildReportSections(d){
 const output=[];
 const add=(kind,title,entries)=>{if(shareSelections[kind])output.push({kind,title,entries})};
 add('qt','큐티 · 말씀 묵상',d.qt.map(n=>({heading:n.title||'제목 없는 큐티',lines:[reportLine('본문',[n.passageRef,n.passageText].filter(Boolean).join('\n')),reportLine('내용',n.note?.content||[n.note?.observation,n.note?.interpretation].filter(Boolean).join('\n')),reportLine('느낀 점',n.note?.feelings||n.note?.reflection),reportLine('적용점',n.note?.application)].filter(Boolean)})));
 add('questions','질문과 나의 답변',d.questions.map((q,i)=>({heading:`질문 ${i+1}`,lines:[reportLine('궁금한 점',q.question),reportLine('나의 생각',q.answer)].filter(Boolean)})));
 add('thoughts','생각노트',d.thoughts.map((n,i)=>({heading:n.title||`생각 ${i+1}`,lines:[reportLine('',n.body)].filter(Boolean)})));
 add('presentation','발표문',d.presentation.map(p=>({heading:p.presentationTitle||'발표문',lines:[reportLine('본문',p.presentationPassage),reportLine('내용',presentationBody(p))].filter(Boolean)})));
 add('practice','말씀 실천 체크리스트',d.practice.map(({goal,log})=>({heading:(log?.status==='done'?'☑ ':'☐ ')+goal.title,lines:[reportLine('실천 기간',(shareRecordDate(goal)||'시작일 미상')+' ~ '+(goal.endDate||'계속')),reportLine('선택 날짜 결과',log?statusName(log.status):'미기록'),reportLine('실천 메모',log?.text)].filter(Boolean)})));
 if(shareSelections.reflections)add('reflections','하루 돌아보기',d.reflections.map((r,i)=>({heading:`하루 점검 ${i+1}`,lines:[reportLine('감사한 일',r.thanks),reportLine('말씀을 실천한 순간',r.did),reportLine('어려웠던 순간',r.hard),reportLine('내일의 실천',r.next)].filter(Boolean)})));
 // The prayer option is independent of QT and reflections. Checking it must actually add a visible section.
 const prayers=[];
 for(const n of d.qt){const value=shareClean(n.note?.prayer||n.prayer);if(value)prayers.push({heading:`큐티 기도 · ${n.title||'제목 없는 큐티'}`,lines:[reportLine('기도',value)]});}
 for(const [i,r] of d.reflections.entries()){const value=shareClean(r.prayer);if(value)prayers.push({heading:`하루 점검 기도 ${i+1}`,lines:[reportLine('기도',value)]});}
 for(const [i,r] of (d.prayers||[]).entries()){const value=shareClean(r.content||r.body||r.text||r.prayer);if(value)prayers.push({heading:r.title||`기도 기록 ${i+1}`,lines:[reportLine('기도',value)]});}
 add('prayer','기도 · 개인 기록',prayers);
 return output;
}
function shareDateSelector(date,id){
 const dates=window._shareDates||[];
 const items=[...new Set([date,...dates])].sort((a,b)=>b.localeCompare(a));
 return `<div class="field"><label for="${id}">확인할 날짜</label><input id="${id}" type="date" value="${esc(date)}" onchange="state.shareDate=this.value;render()"></div><div class="field"><label>기록이 저장된 날짜 바로 선택</label><select onchange="if(this.value){state.shareDate=this.value;render()}"><option value="">날짜를 선택하세요</option>${items.map(d=>`<option value="${esc(d)}" ${d===date?'selected':''}>${esc(d)}${d===date?' · 현재':''}</option>`).join('')}</select></div>`;
}
function shareCountSummary(d){
 const groups=[['큐티',d.qt.length],['질문',d.questions.length],['생각노트',d.thoughts.length],['발표문',d.presentation.length],['실천',d.practice.length],['하루 점검',d.reflections.length],['기도',d.qt.filter(n=>shareClean(n.note?.prayer||n.prayer)).length+d.reflections.filter(r=>shareClean(r.prayer)).length+(d.prayers||[]).filter(r=>shareClean(r.content||r.body||r.text||r.prayer)).length]];
 return `<div class="share-counts">${groups.map(([name,num])=>`<span>${name} <strong>${num}</strong></span>`).join('')}</div><p class="hint">기록은 작성·저장된 날짜를 기준으로 표시해요. 다른 날짜에 작성된 기록은 해당 날짜를 선택하세요.</p>`;
}

function shareFilename(ext){return `말씀을_삶으로_실천_${state.shareDate||today()}.${ext}`}
function downloadBlob(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000)}
function printSharePDF(){if(!shareDocument)return;window.print()}
function shareHtmlDocument(){const el=document.getElementById('reportPaper');return `<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${shareFilename('html')}</title><style>body{font:15px/1.8 -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;max-width:740px;margin:24px auto;padding:0 20px;color:#27382f;background:#fffdf8}.share-sheet-header{border-bottom:3px solid #245c43;padding-bottom:17px}.share-sheet-title{font-size:28px;font-weight:800}.share-sheet-meta{font-size:12px;color:#718274}.share-sheet-section{padding:14px 0;border-bottom:1px solid #e2e9e0;break-inside:avoid}.share-sheet-section h3{color:#245c43}.share-sheet-section p{white-space:pre-wrap;overflow-wrap:anywhere}.share-sheet-footer{font-size:12px;color:#718274;margin-top:20px}@page{size:A4;margin:18mm}.recent-entry{display:flex;flex-direction:column;align-items:flex-start;gap:6px;width:100%;padding:13px 2px;border-bottom:1px solid var(--line);text-align:left}.recent-entry:last-child{border-bottom:0}.recent-entry strong{font-size:15px}.recent-entry .sub{font-weight:400;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

function downloadShareHTML(){downloadBlob(new Blob([shareHtmlDocument()],{type:'text/html;charset=utf-8'}),shareFilename('html'));toast('HTML 파일 저장을 요청했어요')}
function shareLinesFromSections(){let secs=buildReportSections(shareDocument);let lines=[{text:'말씀을 삶으로 실천',type:'title'},{text:formatDate(state.shareDate||today())+' · QT & LIFE',type:'date'}];for(const s of secs){lines.push({text:s.title,type:'heading'});for(const e of s.entries){lines.push({text:e.heading,type:'item'});for(const l of e.lines)lines.push({text:(l.label?l.label+' · ':'')+l.text,type:'body'})}}return lines}
async function makeSharePNG(){if(!shareDocument)throw Error('공유할 날짜를 먼저 선택하세요.');let lines=shareLinesFromSections(),w=950,margin=64,maxWidth=w-margin*2;let canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');if(!ctx)throw Error('캔버스가 지원되지 않아요');const fontFor=t=>t==='title'?'bold 38px sans-serif':t==='heading'?'bold 27px sans-serif':t==='item'?'bold 21px sans-serif':t==='date'?'18px sans-serif':'19px sans-serif';let rows=[];for(const l of lines){ctx.font=fontFor(l.type);let pieces=String(l.text||'').split('\n');for(let piece of pieces){let line='';for(const char of Array.from(piece)){if(ctx.measureText(line+char).width>maxWidth&&line){rows.push({type:l.type,text:line});line=''}line+=char}rows.push({type:l.type,text:line})}rows.push({type:'gap',text:''})}let h=110+rows.reduce((n,r)=>n+(r.type==='title'?66:r.type==='heading'?51:r.type==='gap'?13:33),0)+60;if(h>15000)throw Error('내용이 너무 길어요. 포함 항목을 줄이거나 PDF로 저장해 주세요.');canvas.width=w;canvas.height=h;ctx.fillStyle='#fffdf8';ctx.fillRect(0,0,w,h);ctx.fillStyle='#245c43';ctx.fillRect(0,0,w,12);let y=74;for(const r of rows){if(r.type==='gap'){y+=13;continue}ctx.font=fontFor(r.type);ctx.fillStyle=r.type==='title'||r.type==='heading'?'#245c43':r.type==='date'?'#78857c':'#26372e';ctx.textBaseline='top';ctx.fillText(r.text,margin,y);y+=r.type==='title'?66:r.type==='heading'?51:33}return new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(Error('이미지 생성에 실패했어요')),'image/png'))}
async function downloadSharePNG(){try{let b=await makeSharePNG();downloadBlob(b,shareFilename('png'));toast('PNG 이미지 저장을 요청했어요')}catch(e){alert(e.message)}}
async function shareDailyFile(){try{let blob=await makeSharePNG(),file=new File([blob],shareFilename('png'),{type:'image/png'});if(navigator.canShare?.({files:[file]})&&navigator.share){await navigator.share({files:[file],title:'나의 말씀 기록'});}else{downloadBlob(blob,file.name);toast('공유 메뉴 미지원: PNG 저장을 요청했어요')}}catch(e){if(e.name!=='AbortError')alert('공유 실패: '+e.message)}}


// v2.2: adjust long-form writing areas without interrupting existing autosave.
function expandWritingArea(el){
 if(!el||!['content','presBody','thoughtBody'].includes(el.id))return;
 const min=el.id==='content'? (matchMedia('(max-width:420px)').matches?400:440) : (matchMedia('(max-width:420px)').matches?470:520);
 el.style.height='auto';
 el.style.height=Math.max(min,el.scrollHeight+4)+'px';
}
function expandVisibleWritingAreas(){for(const id of ['content','presBody','thoughtBody']){const el=document.getElementById(id);expandWritingArea(el);if(el&&!el.dataset.focusReady){el.dataset.focusReady='1';const bar=document.createElement('div');bar.className='writing-actions';const hint=document.createElement('span');hint.className='hint';hint.textContent='긴 글도 자유롭게 작성할 수 있어요';const button=document.createElement('button');button.type='button';button.className='writing-expand-btn';button.textContent='⛶ 전체 화면 작성';button.addEventListener('click',()=>openWritingFocus(id));bar.append(hint,button);el.insertAdjacentElement('afterend',bar)}}}
let activeWritingFocus=null;
function closeWritingFocus(){if(!activeWritingFocus)return;const {overlay,source,editor,previousOverflow}=activeWritingFocus;source.value=editor.value;source.dispatchEvent(new Event('input',{bubbles:true}));overlay.remove();document.body.style.overflow=previousOverflow;activeWritingFocus=null;expandWritingArea(source)}
function openWritingFocus(id){const source=document.getElementById(id);if(!source)return;if(activeWritingFocus)closeWritingFocus();const overlay=document.createElement('section');overlay.className='writing-focus';overlay.setAttribute('role','dialog');overlay.setAttribute('aria-modal','true');const bar=document.createElement('div');bar.className='writing-focus-bar';const title=document.createElement('strong');title.textContent=id==='content'?'큐티 · 내용 집중 작성':id==='presBody'?'발표문 · 내용 집중 작성':'생각노트 · 집중 작성';const done=document.createElement('button');done.type='button';done.textContent='완료';done.addEventListener('click',closeWritingFocus);bar.append(title,done);const editor=document.createElement('textarea');editor.setAttribute('aria-label',title.textContent);editor.value=source.value;editor.placeholder=source.placeholder;editor.addEventListener('input',()=>{source.value=editor.value;source.dispatchEvent(new Event('input',{bubbles:true}));foot.textContent=`${editor.value.length.toLocaleString('ko-KR')}자 · 작성 중 자동 반영`});const foot=document.createElement('div');foot.className='writing-focus-foot';foot.textContent=`${editor.value.length.toLocaleString('ko-KR')}자 · 작성 중 자동 반영`;overlay.append(bar,editor,foot);const previousOverflow=document.body.style.overflow;document.body.style.overflow='hidden';document.body.append(overlay);activeWritingFocus={overlay,source,editor,previousOverflow};editor.focus();editor.setSelectionRange(editor.value.length,editor.value.length)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&activeWritingFocus)closeWritingFocus()});
document.addEventListener('input',event=>{if(event.target instanceof HTMLTextAreaElement)expandWritingArea(event.target)},true);
const writingObserver=new MutationObserver(()=>{requestAnimationFrame(expandVisibleWritingAreas)});
writingObserver.observe(document.getElementById('view'),{childList:true,subtree:false});
document.addEventListener('DOMContentLoaded',expandVisibleWritingAreas);


// 앱 화면 확대 제어: 두 손가락 확대 및 더블탭 확대 방지 (일반 한 손가락 스크롤은 유지).
document.addEventListener('gesturestart', function(event){event.preventDefault()}, {passive:false});
document.addEventListener('gesturechange', function(event){event.preventDefault()}, {passive:false});
document.addEventListener('gestureend', function(event){event.preventDefault()}, {passive:false});
document.addEventListener('touchmove', function(event){
  if(event.touches && event.touches.length > 1 && event.cancelable) event.preventDefault();
}, {passive:false});
document.addEventListener('dblclick', function(event){
  // 텍스트 편집과 선택에 필요한 기본 동작을 방해하지 않는다.
  if(event.target.closest && event.target.closest('input, textarea, [contenteditable="true"]')) return;
  if(event.cancelable) event.preventDefault();
}, {passive:false});

// v2.7: Safari/WKWebView에서 상단 메뉴 더블탭 확대가 남는 경우에만 두 번째 터치를 막습니다.
// 첫 번째 탭은 정상 클릭되고, 입력창·본문 영역에는 영향을 주지 않습니다.
(()=>{
  const header = document.querySelector('header');
  if (!header) return;
  let lastTapAt = 0;
  let lastX = 0, lastY = 0;
  header.addEventListener('touchend', (event) => {
    if (!event.changedTouches || event.changedTouches.length !== 1 || event.touches.length) return;
    const touch = event.changedTouches[0];
    const now = performance.now();
    const near = Math.abs(touch.clientX-lastX)<50 && Math.abs(touch.clientY-lastY)<50;
    if (now-lastTapAt < 330 && near) {
      if (event.cancelable) event.preventDefault();
      lastTapAt = 0;
    } else {
      lastTapAt = now;
      lastX = touch.clientX;
      lastY = touch.clientY;
    }
  }, {passive:false});
})();
