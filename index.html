<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=yes"><meta name="theme-color" content="#f8f6f0"><title>말씀을 삶으로 실천 · QT & LIFE v1.5</title><style>
:root{--bg:#f8f6f0;--surface:#fff;--ink:#27342d;--muted:#7b877e;--line:#e7eae3;--brand:#28624b;--soft:#e9f2e9;--gold:#d7aa70;--nav:82px}*{box-sizing:border-box}html{height:100%;-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;overscroll-behavior:none}button,input,textarea,select{font:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.5;cursor:default}.app{max-width:680px;margin:auto;min-height:100dvh;background:var(--bg)}header{position:sticky;top:0;z-index:5;background:rgba(248,246,240,.95);backdrop-filter:blur(15px);padding:calc(env(safe-area-inset-top) + 14px) 20px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(200,211,200,.45)}.eyebrow{font-size:11px;letter-spacing:1.5px;color:var(--brand);font-weight:800}.logo{font-family:Georgia,'Noto Serif KR',serif;font-size:25px;font-weight:800;letter-spacing:-1px}.iconbtn{border:1px solid var(--line);border-radius:14px;background:white;padding:10px;color:var(--ink)}main{padding:20px 18px calc(var(--nav) + env(safe-area-inset-bottom) + 28px);min-height:70vh}h1,h2,h3,p{margin:0}h1{font-size:25px;line-height:1.3;letter-spacing:-.8px}h2{font-size:19px;letter-spacing:-.5px}h3{font-size:16px}p{line-height:1.7}.sub{color:var(--muted);font-size:13px}.section{margin:22px 0 12px}.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:13px;box-shadow:0 3px 16px rgba(44,77,55,.025)}.hero{background:linear-gradient(130deg,#245a45,#41795d);border-radius:24px;padding:24px 21px;color:#fff;margin-bottom:17px}.hero .sub{color:#d8e8da}.hero h1{margin:10px 0}.hero button{background:white;color:var(--brand)}.btn{border:0;border-radius:14px;background:var(--brand);color:#fff;min-height:46px;padding:11px 15px;font-weight:750;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn.secondary{background:var(--soft);color:var(--brand)}.btn.ghost{background:#f1f3ef;color:var(--ink)}.btn.danger{background:#ffeaea;color:#a52b2b}.btn.full{width:100%}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.stack{display:grid;gap:10px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.mini{background:#f7faf6;border-radius:15px;padding:15px}.mini strong{display:block;font-size:21px;color:var(--brand);margin-bottom:4px}.pill{display:inline-block;background:var(--soft);color:var(--brand);border-radius:100px;padding:5px 10px;font-size:12px;font-weight:750}.muted{color:var(--muted)}label{font-size:13px;font-weight:750;display:block;margin-bottom:7px}.field{margin:15px 0}input,textarea,select{border:1px solid #dce3dc;background:white;color:var(--ink);border-radius:13px;width:100%;padding:12px;outline:none;min-height:45px}input:focus,textarea:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 3px #28624b18}textarea{resize:vertical;min-height:95px;line-height:1.6}textarea.large{min-height:125px}.hint{font-size:12px;color:var(--muted);margin-top:5px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:680px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding:8px 2px calc(7px + env(safe-area-inset-bottom));background:rgba(255,255,255,.97);border-top:1px solid var(--line);z-index:10;backdrop-filter:blur(14px)}.nav button{border:0;background:none;color:#94a197;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;padding:7px 2px;min-height:52px}.nav button.active{color:var(--brand);font-weight:800}.nav .sym{font-size:19px}.nav button{font-size:10px;white-space:nowrap;letter-spacing:-.4px}.choice{display:block;text-align:left;width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;background:white;margin:7px 0;color:var(--ink)}.choice.selected{border-color:var(--brand);background:var(--soft)}.choice.correct{border-color:#369668;background:#e7f9ea}.choice.wrong{border-color:#ce8f8f;background:#fff0ed}.bar{height:8px;background:#e5ebe4;border-radius:10px;overflow:hidden}.bar span{display:block;height:100%;background:var(--brand)}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{border:1px solid var(--line);padding:9px 0;background:white;border-radius:11px;text-align:center;font-size:13px;color:var(--ink)}.day.mark{background:var(--soft);border-color:#96baa3;color:var(--brand);font-weight:800}.day.today{outline:2px solid var(--gold)}.record{border-left:3px solid var(--brand);padding-left:12px;margin-top:10px}.empty{text-align:center;padding:24px 10px;color:var(--muted)}.small{font-size:12px}.warning{background:#fff5e4;border-radius:13px;padding:12px;font-size:12px;color:#796340}.toast{position:fixed;left:50%;bottom:calc(95px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#263c30;color:white;padding:11px 17px;border-radius:13px;z-index:30;font-size:13px;box-shadow:0 5px 15px #0002;max-width:90vw}.hidden{display:none!important}.divider{border:0;border-top:1px solid var(--line);margin:16px 0}.checkline{display:flex;align-items:start;gap:9px;padding:10px 0}.checkline input{width:20px;min-height:20px;accent-color:var(--brand)}.checkline label{font-weight:500;margin:0}.inline{display:flex;gap:8px;flex-wrap:wrap}.inline>*{flex:1}.foot{text-align:center;font-size:11px;color:var(--muted);padding:20px 0}body.dark{--bg:#161e1a;--surface:#222c26;--ink:#edf2ed;--muted:#b4beb5;--line:#38483d;--brand:#9bd8af;--soft:#304a39}body.dark header{background:#161e1af0}body.dark input,body.dark textarea,body.dark select,body.dark .choice,body.dark .day,body.dark .iconbtn{background:var(--surface);color:var(--ink);border-color:var(--line)}body.dark .mini{background:#2b3930}body.dark .nav{background:#1d2822f5}body.dark .btn.ghost{background:#344037}body.dark .hero{background:linear-gradient(130deg,#284c37,#355b45)}@media(min-width:700px){body{background:#e9eee7}.app{box-shadow:0 5px 45px #0001}}
input.checkinput{width:19px;min-height:19px;vertical-align:middle;margin-right:7px;accent-color:var(--brand)}.reading{font-size:17px;line-height:1.9}.reading p{line-height:1.9} .qt-open{display:block;text-align:left;width:100%;border:0;background:transparent;color:inherit;padding:10px 0 0;cursor:pointer}.qt-open h3{font-size:19px}.qt-more{display:block;color:var(--brand);font-size:13px;font-weight:800;margin-top:13px}.qt-record{transition:transform .15s ease}.qt-record:active{transform:scale(.99)}.hero h1{font-size:clamp(24px,5.4vw,33px);line-height:1.48;word-break:keep-all}</style></head><body><div class="app"><header><div><div class="eyebrow">QT & LIFE</div><div class="logo">말씀을 삶으로 실천 <span style="color:#b49b6a">✝</span></div></div><button class="iconbtn" onclick="navigate('settings')" aria-label="설정">⚙️</button></header><main id="view"></main><nav class="nav" id="nav" aria-label="하단 메뉴"></nav></div><div id="toast" class="toast hidden" role="status"></div><input type="file" id="importFile" accept="application/json,.json" class="hidden"><script>
'use strict';
const DB_NAME='malssumdaero_qt_life',VERSION=3,STORES=['qtQuestions','thoughtNotes','presentations','settings','qtNotes','practiceGoals','practiceLogs','reflections','questions','testAttempts','challenges','prayers'];let db,route='home',state={date:today(),qt:null,goal:null,quiz:null,quizIndex:0,quizAnswers:[],testConfig:{scope:'today',type:'mixed',count:5},growthMonth:today().slice(0,7)};
function today(){let d=new Date();return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(d)}function uid(){return crypto.randomUUID?crypto.randomUUID():'id_'+Date.now()+'_'+Math.random().toString(36).slice(2)}function now(){return new Date().toISOString()}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(s){let e=document.getElementById('toast');e.textContent=s;e.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hidden'),2400)}function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DB_NAME,VERSION);r.onupgradeneeded=()=>{let d=r.result;for(let x of STORES)if(!d.objectStoreNames.contains(x))d.createObjectStore(x,{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function tx(store,mode='readonly'){return db.transaction(store,mode).objectStore(store)}function save(store,obj){return new Promise((res,rej)=>{let r=tx(store,'readwrite').put(obj);r.onsuccess=()=>res(obj);r.onerror=()=>rej(r.error)})}function all(store){return new Promise((res,rej)=>{let r=tx(store).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function get(store,id){return new Promise((res,rej)=>{let r=tx(store).get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function del(store,id){return new Promise((res,rej)=>{let r=tx(store,'readwrite').delete(id);r.onsuccess=res;r.onerror=()=>rej(r.error)})}async function byDate(store,date){return (await all(store)).filter(x=>x.localDate===date)}function formatDate(d){return `${d.slice(0,4)}.${d.slice(5,7)}.${d.slice(8,10)}`}function dateShift(date,n){let d=new Date(date+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}function heading(title,sub=''){return `<div class="section"><h1>${title}</h1>${sub?`<p class="sub">${sub}</p>`:''}</div>`}function button(t,act,kind=''){return `<button class="btn ${kind}" onclick="${act}">${t}</button>`}function navHtml(){let items=[['home','⌂','홈'],['qt','▤','큐티'],['questions','❔','질문'],['thoughts','✎','생각노트'],['presentation','🎙','발표문'],['practice','♧','실천'],['growth','▥','성장']];document.getElementById('nav').innerHTML=items.map(([id,ic,t])=>`<button class="${route===id?'active':''}" onclick="navigate('${id}')"><span class="sym">${ic}</span>${t}</button>`).join('')}
function navigate(to){if(route==='qtEdit'&&to!=='qtEdit'&&document.getElementById('passage'))saveQT(false);if(route==='presentation'&&to!=='presentation'&&document.getElementById('presTitle'))savePresentation(false);if(route==='thoughts'&&to!=='thoughts'&&document.getElementById('thoughtBody'))saveThought(false);route=to;history.pushState({route:to},'',location.pathname+location.search+'#'+to);render();window.scrollTo(0,0)}window.onpopstate=()=>{route=location.hash.slice(1)||'home';render()};async function render(){navHtml();let v=document.getElementById('view');try{if(route==='home')await home(v);else if(route==='qt')await qtLibrary(v);else if(route==='qtEdit')await qt(v);else if(route==='presentation')await presentation(v);else if(route==='questions')await questions(v);else if(route==='thoughts')await thoughts(v);else if(route==='practice')await practice(v);else if(route==='growth')await growth(v);else if(route==='settings')await settings(v);else if(route==='review')await review(v);else if(route==='notes')await notes(v);else navigate('home')}catch(e){console.error(e);v.innerHTML=`<div class="card"><h2>화면을 여는 중 문제가 발생했습니다</h2><p class="sub">${esc(e.message)}</p>${button('다시 열기','render()','secondary')}</div>`}}
const defaults={content:'',feelings:'',application:'',prayer:''};
async function currentNote(){if(route==='qtEdit'&&state.qtNew)return null;if(route==='qtEdit'&&state.qtEditId){let note=await get('qtNotes',state.qtEditId);if(note)return note;}let a=await byDate('qtNotes',state.date);return a.sort((x,y)=>y.updatedAt.localeCompare(x.updatedAt))[0]||null}
async function currentGoal(){let a=await byDate('practiceGoals',state.date);return a[0]||null}
async function home(v){let notes=await byDate('qtNotes',today()),goals=await byDate('practiceGoals',today()),refl=await byDate('reflections',today()),presentations=await byDate('presentations',today());let n=notes[0],g=goals[0];v.innerHTML=`<p class="sub">${formatDate(today())} · 오늘도 말씀과 함께</p><div class="hero"><div class="sub">오늘의 여정</div><h1>큐티는 적는 것으로 끝나지 않습니다.<br>삶이 바뀌지 않으면 아직 끝난 게 아닙니다.</h1><p class="sub" style="margin-bottom:16px">기록보다 중요한 것은 순종입니다.<br>오늘 들은 말씀을 오늘의 삶으로 옮기세요.</p>${button(n?'오늘의 큐티 이어쓰기 →':'오늘의 큐티 시작 →',"openQTEditor()")}</div><div class="grid3"><div class="mini"><strong>${notes.length}</strong><span class="small muted">오늘 큐티</span></div><div class="mini"><strong>${presentations.length}</strong><span class="small muted">발표 준비</span></div><div class="mini"><strong>${refl.length}</strong><span class="small muted">하루 점검</span></div></div><div class="card" style="margin-top:14px"><h3>🎙 큐티를 내 말로 발표해요</h3><p class="sub" style="margin:10px 0">말씀의 내용, 깨달음, 실천 약속을 정리해서 발표문을 만들고 연습해요.</p>${button('발표문 준비하기',"navigate('presentation')",'secondary full')}</div><h2 class="section">오늘의 실천</h2><div class="card">${g?`<span class="pill">${esc(g.statusLabel||'실천 중')}</span><h3 style="margin:11px 0">${esc(g.title)}</h3><p class="sub">연결 본문: ${esc(g.passageRef||'없음')}</p>${button('실천 기록하기',"navigate('practice')",'secondary full')}`:`<p class="sub" style="margin-bottom:13px">큐티에서 삶에 적용할 작은 행동을 정해보세요.</p>${button('실천 목표 만들기',"navigate('practice')",'secondary full')}`}</div><h2 class="section">저녁에 돌아보기</h2><div class="card"><p class="sub" style="margin-bottom:13px">오늘 배운 말씀은 어떤 순간에 생각났나요? 어려웠던 순간도 정직하게 기록해요.</p>${button(refl.length?'점검 기록 다시 보기':'하루 점검 작성',"navigate('review')",'secondary full')}</div><div class="card"><div class="row"><h3>최근 큐티</h3>${button('전체 기록',"navigate('notes')",'ghost')}</div><div id="recentNotes" class="sub" style="margin-top:10px">${n?`${esc(n.title||n.passageRef||'제목 미지정')} · ${esc((n.note?.feelings||n.note?.content||n.note?.reflection||n.note?.observation||'작성 중').slice(0,65))}`:'아직 기록이 없어요.'}</div></div>`}
function openQTEditor(id=null){state.qtEditId=id;state.qtNew=!id; if(!id)state.date=today();navigate('qtEdit')}
async function openQTNote(id){let n=await get('qtNotes',id);if(!n){toast('기록을 찾을 수 없어요');return}state.date=n.localDate;state.qtEditId=id;state.qtNew=false;navigate('qtEdit')}
async function newQTNote(){openQTEditor()}
async function qtLibrary(v){
 let records=(await all('qtNotes')).sort((a,b)=>b.localDate.localeCompare(a.localDate)||b.updatedAt.localeCompare(a.updatedAt));
 v.innerHTML=heading('내 큐티노트','쌓아온 말씀 묵상을 노트 앱처럼 꺼내보고 이어 적으세요.')+`<div class="card" style="background:var(--soft)"><div class="row"><strong>📖 내 말씀 기록 ${records.length}개</strong>${button('＋ 새 큐티','newQTNote()','')}</div><div class="field" style="margin-top:14px"><input id="qtSearch" type="search" placeholder="제목, 본문, 묵상 내용 검색" oninput="filterQTNotes()" aria-label="큐티 기록 검색"></div><div class="row" style="margin-top:10px"><select id="qtOrder" onchange="filterQTNotes()" aria-label="정렬"><option value="new">최신 날짜순</option><option value="old">오래된 날짜순</option><option value="edited">최근 수정순</option></select><span class="sub" id="qtCount">${records.length}개의 노트</span></div></div><div id="qtCards"></div>`;
 window._qtLibraryRecords=records;filterQTNotes();
}
function filterQTNotes(){let records=window._qtLibraryRecords||[],q=(document.getElementById('qtSearch')?.value||'').toLocaleLowerCase().trim(),order=document.getElementById('qtOrder')?.value||'new';let filtered=records.filter(n=>[n.title,n.passageRef,n.passageText,...Object.values(n.note||{})].join(' ').toLocaleLowerCase().includes(q));if(order==='old')filtered.sort((a,b)=>a.localDate.localeCompare(b.localDate));if(order==='edited')filtered.sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt));let count=document.getElementById('qtCount');if(count)count.textContent=filtered.length+'개의 노트';let target=document.getElementById('qtCards');if(!target)return;target.innerHTML=filtered.length?filtered.map(n=>{let excerpt=n.note?.feelings||n.note?.content||n.note?.reflection||n.note?.observation||n.note?.application||'본문을 읽고 묵상을 시작하세요.';return `<article class="card qt-record"><div class="row"><span class="pill">${esc(n.localDate)}</span><button class="iconbtn" aria-label="이 큐티 삭제" onclick="deleteRecord('qtNotes','${n.id}')">🗑</button></div><button class="qt-open" onclick="openQTNote('${n.id}')"><h3>${esc(n.title||'제목 없는 큐티')}</h3><div class="sub" style="margin-top:5px">${esc(n.passageRef||'본문 미입력')}</div><p class="sub" style="margin-top:11px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden">${esc(excerpt.slice(0,180))}</p><span class="qt-more">노트 열기 →</span></button></article>`}).join(''):`<div class="card empty">${q?'검색 결과가 없어요.':'아직 큐티 기록이 없어요. 첫 큐티를 작성해 보세요.'}</div>`}
async function qt(v){
 let n=await currentNote(),old=n?.note||{},content=old.content??[old.observation,old.interpretation].filter(Boolean).join('\n\n'),feelings=old.feelings??old.reflection??'';
 v.innerHTML=heading('큐티 작성·수정','날짜 · 제목 · 본문 · 내용 · 느낀 점 · 적용점 · 기도')+`<div style="margin-bottom:12px">${button('← 내 큐티노트 목록',"navigate('qt')",'secondary')}</div>`+`
 <div class="card">
  <div class="field"><label for="qtDate">① 날짜</label><input type="date" id="qtDate" value="${esc(state.date)}" onchange="changeQTDate(this.value)"></div>
  <div class="field"><label for="qtTitle">② 제목</label><input id="qtTitle" value="${esc(n?.title||'')}" placeholder="예: 듣기는 속히, 말하기는 더디" oninput="scheduleQTSave()"></div>
  <div class="field"><label for="passage">③ 본문 (성경 구절)</label><input id="passage" value="${esc(n?.passageRef||'')}" placeholder="예: 야고보서 1:19-20" oninput="scheduleQTSave()"><textarea id="passageText" class="large" placeholder="묵상할 성경 본문을 직접 적어보세요. (선택)" oninput="scheduleQTSave()">${esc(n?.passageText||'')}</textarea><p class="hint">본문은 구절 주소와 본문 내용을 함께 기록할 수 있어요.</p></div>
  <div class="field"><label for="content">④ 내용 (말씀의 내용과 이해한 점)</label><textarea id="content" class="large" placeholder="오늘 읽은 말씀은 어떤 내용인가요?" oninput="scheduleQTSave()">${esc(content)}</textarea></div>
  <div class="field"><label for="feelings">⑤ 느낀 점</label><textarea id="feelings" class="large" placeholder="말씀을 읽으며 어떤 생각이나 깨달음이 있었나요?" oninput="scheduleQTSave()">${esc(feelings)}</textarea></div>
  <div class="field"><label for="application">⑥ 적용점 (오늘의 행동 약속)</label><textarea id="application" class="large" placeholder="예: 동료가 말할 때 끼어들지 않고 끝까지 듣기" oninput="scheduleQTSave()">${esc(old.application||'')}</textarea><p class="hint">여기에 적은 내용이 실천 화면의 목표로 연결됩니다. 작고 구체적인 행동이 좋아요.</p></div>

async function startQuiz(){let scope=document.getElementById('scope').value,type=document.getElementById('quizType').value,count=+document.getElementById('count').value;let pool=BANK.filter(q=>type==='mixed'||q.type===type);if(scope!=='all'){let days=scope==='today'?[today()]:Array.from({length:7},(_,i)=>dateShift(today(),-i));let notes=(await all('qtNotes')).filter(n=>days.includes(n.localDate));pool=pool.filter(q=>notes.some(n=>n.passageRef.replaceAll(/\s/g,'').includes(q.ref.replaceAll(/\s/g,''))||q.ref.replaceAll(/\s/g,'').includes(n.passageRef.replaceAll(/\s/g,''))&&n.passageRef.length>4))}if(!pool.length){toast('이 범위에 준비된 문제가 없어요. 전체 문제은행을 선택하세요.');return}state.quiz={scope,type,items:shuffle(pool).slice(0,count),startedAt:now()};state.quizIndex=0;state.quizAnswers=[];renderQuiz()}function renderQuiz(){route='quiz';navHtml();let quiz=state.quiz;if(!quiz){navigate('test');return}let i=state.quizIndex,q=quiz.items[i];document.getElementById('view').innerHTML=`<div class="row"><h2>말씀 이해도 테스트</h2><span class="pill">${i+1} / ${quiz.items.length}</span></div><div class="bar" style="margin:17px 0"><span style="width:${(i+1)/quiz.items.length*100}%"></span></div><div class="card"><span class="sub">${esc(q.ref)}</span><h2 style="margin:13px 0 20px">${esc(q.q)}</h2>${q.opts.map((o,j)=>`<button class="choice" id="ans${j}" onclick="answerQuiz(${j})">${j+1}. ${esc(o)}</button>`).join('')}<div id="feedback"></div><div id="nextButton"></div></div>`}function answerQuiz(j){let q=state.quiz.items[state.quizIndex];if(state.quizAnswers[state.quizIndex]!==undefined)return;state.quizAnswers[state.quizIndex]=j;q.opts.forEach((_,k)=>{let e=document.getElementById('ans'+k);e.disabled=true;if(k===q.a)e.classList.add('correct');if(k===j&&k!==q.a)e.classList.add('wrong')});document.getElementById('feedback').innerHTML=`<div class="mini" style="margin-top:14px"><strong style="font-size:15px">${j===q.a?'정답이에요!':'다시 복습해보세요.'}</strong><p class="sub">${esc(q.ex)}</p></div>`;document.getElement async function setTheme(t){await save('settings',{id:'theme',value:t});document.body.classList.toggle('dark',t==='dark');toast('테마가 변경되었어요')}
async function exportData(){try{let data={app:'malssumdaero-qt-life',schemaVersion:3,exportedAt:now(),stores:{}};for(let s of STORES)data.stores[s]=await all(s);let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`malssumdaero_backup_${today()}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('백업 파일을 만들었어요')}catch(e){toast('백업 오류: '+e.message)}}
document.getElementById('importFile').addEventListener('change',async function(){let f=this.files[0];if(!f)return;try{if(f.size>20*1024*1024)throw Error('파일이 20MB보다 커요');let data=JSON.parse(await f.text());if(data.app!=='malssumdaero-qt-life'||![1,2,3].includes(data.schemaVersion)||!data.stores||typeof data.stores!=='object')throw Error('호환되지 않는 백업입니다');let list=STORES.flatMap(s=>(data.stores[s]||[]).map(x=>[s,x]));if(list.some(([s,x])=>!STORES.includes(s)||!x||typeof x!=='object'||typeof x.id!=='string'||x.id.length>200))throw Error('백업 데이터 형식이 올바르지 않아요');if(!confirm(`총 ${list.length}개의 항목을 불러올까요? 같은 ID의 기록은 덮어씁니다.`))return;for(let [s,x] of list)await save(s,x);let theme=(await get('settings','theme'))?.value||'light';document.body.classList.toggle('dark',theme==='dark');toast('복원이 완료되었어요');render()}catch(e){alert('파일 불러오기 실패: '+e.message)}finally{this.value=''}});
(async function init(){try{db=await openDB();let theme=(await get('settings','theme'))?.value||'light';document.body.classList.toggle('dark',theme==='dark');let requested=location.hash.slice(1);route=['home','qt','presentation','questions','thoughts','practice','growth','settings','review','notes'].includes(requested)?requested:'home';await render()}catch(e){document.getElementById('view').innerHTML='<div class="card"><h2>저장소를 열 수 없습니다</h2><p class="sub">이 브라우저나 ZIP OS에서 IndexedDB가 차단되어 있을 수 있습니다. 일반 브라우저에서 다시 실행하거나 저장소 설정을 확인해 주세요.</p><p>'+esc(e.message)+'</p></div>'}})();
</script></body></html>
